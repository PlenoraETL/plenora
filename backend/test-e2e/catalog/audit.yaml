area: 'audit'
description: 'Audit log'
tests:
  - id: 'AUDIT-001'
    status: 'META'
    title: '`@audit_action` decorator scrive entry'
    granularity: 'smoke'
    priority: 'meta'
    tags:
          - 'audit'
          - 'cross-cutting'
    references:
          - 'app/shared/audit_action.py'
          - 'test-e2e/runner/cross_cutting.py'
    steps: 'trigger azione sensibile (es. delete connection)'
    assertion: |
          row in `audit_log` con actor, action, resource, timestamp.
          [META / cross-cutting-policy] Sostituito da `assert_audit_logged`
          in `runner/cross_cutting.py`, chiamato da ogni test write
          (PREP-004..PREP-021, ADM-*, IDEM-*). Non eseguito come test
          pytest dedicato: l'asserzione e' esercitata implicitamente da
          tutti i test che fanno azioni audit-able.
  - id: 'AUDIT-002'
    status: 'TODO'
    title: 'Retention `AUDIT_RETENTION_DAYS=365`'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'audit'
          - 'retention'
    assertion: 'entry > 365gg eliminate dal task di pulizia'
  - id: 'AUDIT-003'
    status: 'TODO'
    title: 'Cron lock acquisito da una sola istanza beat'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'audit'
          - 'scheduler'
    references:
          - 'app/core/scheduler/scheduler_lock.py'
    assertion: '2 worker concorrenti → 1 acquisisce, 1 attende'
