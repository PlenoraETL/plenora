area: 'reqid'
description: 'RequestId middleware + propagation'
tests:
  - id: 'REQID-001'
    status: 'META'
    title: 'Header `X-Request-ID` echo in response'
    granularity: 'smoke'
    priority: 'meta'
    tags:
          - 'request-id'
          - 'cross-cutting'
    references:
          - 'app/core/auth/request_id_middleware.py'
          - 'test-e2e/runner/cross_cutting.py'
    steps: '`GET /health` con header `X-Request-ID: rid-test-001`'
    assertion: |
          response include header `X-Request-ID: rid-test-001` (echo
          identico); ogni log emesso durante request ha field
          `request_id=rid-test-001`.
          [META / cross-cutting-policy] Sostituito dalla fixture autouse
          `_global_response_audit` in `runner/cross_cutting.py`: ogni test
          che fa richieste HTTP eredita questo check su ogni 2xx response.
  - id: 'REQID-002'
    status: 'META'
    title: 'Trust-but-verify: truncate a 64 char'
    granularity: 'smoke'
    priority: 'meta'
    tags:
          - 'request-id'
          - 'cross-cutting'
    references:
          - 'app/core/auth/request_id_middleware.py'
          - 'test-e2e/runner/cross_cutting.py'
    steps: 'request con `X-Request-ID` di 200 caratteri (`A` ripetuto)'
    assertion: |
          response echo header con esattamente 64 caratteri (truncate); log
          `request_id_truncated original_length=200`; nessun reject (trust).
          [META / cross-cutting-policy] Sostituito da
          `assert_request_id_propagated` (verifica `len(rid) <= 64`) chiamato
          dall'autouse fixture su ogni 2xx.
  - id: 'REQID-003'
    status: 'TODO'
    title: 'Propagation Celery via `before_task_publish`/`task_prerun`/`task_postrun`'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'request-id'
          - 'celery'
    references:
          - 'workers/celery_app.py:221-285'
    steps: '1) request HTTP con `X-Request-ID: rid-celery-001` che enqueue task 2) ispeziona log worker celery'
    assertion: 'task headers Celery contengono `request_id=rid-celery-001` (signal `before_task_publish`); worker log durante esecuzione ha `request_id=rid-celery-001` (signal `task_prerun` set context); cleanup post-task (signal `task_postrun` clear context); request_id propagato anche a sub-task'
  - id: 'REQID-004'
    status: 'TODO'
    title: 'Fallback: se non incoming, usa `task_id` come request_id'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'request-id'
          - 'spatial'
    references:
          - 'workers/celery_app.py:221-285'
    steps: 'enqueue task da scheduler beat (no HTTP request → no incoming request_id)'
    assertion: 'log worker ha `request_id=<celery_task_id>`; correlation usabile via task_id; response API che query `GET /runs/{run_id}` può linkare ai log via `task_id`'
