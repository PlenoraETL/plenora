area: 'bck'
description: 'Backup / restore'
tests:
  - id: 'BCK-001'
    status: 'TODO'
    title: 'Trigger backup → file gzip su BACKUP_BUCKET, dimensione > 0'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'backup'
    prereq:
          tests:
                  - 'ADM-001'
    references:
          - 'scripts/backup_db.py'
          - 'app/core/admin_backups/service.py'
    assertion: 'object presente in `BACKUP_BUCKET`, content-type `application/gzip`, size > 1KB'
  - id: 'BCK-002'
    status: 'TODO'
    title: 'Restore in DB sandbox → schema + dati identici, conteggi match'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'backup'
          - 'soft-delete'
    prereq:
          tests:
                  - 'BCK-001'
    steps: '1) crea DB sandbox 2) `pg_restore` del backup 3) confronta count per ogni tabella'
    assertion: 'count(tabella) source == count(tabella) sandbox per tutte le tabelle plenora'
  - id: 'BCK-003'
    status: 'TODO'
    title: 'Backup parziale per gruppo'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'backup'
    prereq:
          tests:
                  - 'ADM-001'
    steps: 'trigger backup con filtro `group_id=A`'
    assertion: 'backup contiene solo entità gruppo A; entità gruppo B assenti dal dump'
  - id: 'BCK-004'
    status: 'TODO'
    title: 'Verifica integrità: `pg_restore --list` su backup'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'backup'
          - 'soft-delete'
    prereq:
          tests:
                  - 'BCK-001'
    steps: '`pg_restore --list backup.gz`'
    assertion: 'TOC parsing OK, no errori, lista oggetti = N atteso'
  - id: 'BCK-005'
    status: 'TODO'
    title: 'Retention: backup vecchi rimossi dopo N giorni'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'backup'
          - 'retention'
    prereq:
          tests:
                  - 'ADM-001'
    references:
          - 'app/core/admin_backups/service.py'
    steps: '1) crea backup con `created_at` simulato a -N-1gg 2) trigger retention task'
    assertion: 'object rimosso dal bucket; entry log `backup_retention_deleted`'
  - id: 'BCK-006'
    status: 'TODO'
    title: 'Backup durante write → consistenza preservata (snapshot/MVCC)'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'backup'
    prereq:
          tests:
                  - 'BCK-001'
    steps: '1) start lungo INSERT batch 2) trigger backup a metà 3) restore in sandbox'
    assertion: 'sandbox contiene snapshot consistente (count = valore al momento di start backup), no row parzialmente inserito'
  - id: 'BCK-007'
    status: 'TODO'
    title: 'Trigger backup rifiuta se già in corso; `audit_action` richiede `current_user` kwarg'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'backup'
          - 'security'
    references:
          - 'app/core/admin_backups/router.py'
          - 'app/shared/audit_action.py'
    steps: '1) `POST /admin/backups/trigger` 2) immediatamente prima del completamento `POST /admin/backups/trigger` di nuovo 3) inspeziona audit_log'
    assertion: 'prima 202; seconda 409 con `error_code=backup_already_running`; ogni entry in `audit_log` per backup contiene `actor=<current_user.email>` (kwarg `current_user` propagato dal decorator `audit_action`); chiamata interna senza `current_user` → 500 con messaggio `audit_action requires current_user kwarg`'
