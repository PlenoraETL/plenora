area: 'ret'
description: 'Retention archive'
tests:
  - id: 'RET-001'
    status: 'TODO'
    title: '`LOG_ARCHIVE_ENABLED=true`: dopo `LOG_RETENTION_DAYS` log archiviati'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'retention'
    references:
          - 'workers/beat_scheduler.py:848-1132'
    steps: '1) `LOG_ARCHIVE_ENABLED=true`, `LOG_RETENTION_DAYS=30`, `LOG_ARCHIVE_BUCKET=plenora-logs` 2) inserisci log con `created_at = now() - 31 days` 3) trigger retention beat'
    assertion: 'log eliminato da tabella DB; oggetto gzip presente in bucket `plenora-logs` con naming `log_archive_<date>.gz`; content-type `application/gzip`; row count archive == row count rimossi da DB'
  - id: 'RET-002'
    status: 'TODO'
    title: '`AUDIT_RETENTION_DAYS` rispettato'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'retention'
    references:
          - 'workers/beat_scheduler.py:848-1132'
    steps: '1) `AUDIT_RETENTION_DAYS=365` 2) audit_log entry con `created_at = now() - 366 days` e altre con -364 days 3) trigger retention'
    assertion: 'entry > 365gg eliminate; entry < 365gg preservate; log `audit_retention_cleaned removed=N retained=M`'
  - id: 'RET-003'
    status: 'TODO'
    title: '`SET LOCAL plenora.retention_cleanup=true` bypassa trigger DB'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'retention'
    references:
          - 'workers/beat_scheduler.py:848-1132'
    steps: '1) tabelle con trigger BEFORE DELETE che rifiuta delete normali 2) retention task esegue DELETE in transazione con `SET LOCAL plenora.retention_cleanup=true`'
    assertion: 'DELETE riuscito (trigger bypassato grazie a session var); DELETE fuori da retention task (senza set var) → bloccato dal trigger; nessun delete cross-talk'
  - id: 'RET-004'
    status: 'TODO'
    title: 'Observability circolare: INSERT su `logs` durante retention → no infinite loop'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'retention'
    references:
          - 'workers/beat_scheduler.py:848-1132'
    steps: '1) abilita logging nelle azioni di retention (cleanup INSERT su `logs` ad ogni step) 2) trigger retention con backlog grande'
    assertion: 'retention task termina in tempo finito (no spin); INSERT log durante retention NON re-triggera retention immediato (es. flag `in_retention_cycle` o tabella `logs_retention_pending`); count log generati < threshold di sicurezza (es. < 100 per cleanup cycle)'
