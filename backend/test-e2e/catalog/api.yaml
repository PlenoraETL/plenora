area: 'api'
description: 'CRUD endpoint plenora (isolati)'
tests:
  - id: 'API-001'
    status: 'TODO'
    title: 'Crea connection con credenziali errate → connection-string-test fallisce'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'api'
    prereq:
          tests:
                  - 'PREP-002'
    assertion: '201 sulla creazione, ma `POST /connections/{id}/test` ritorna 200 + `{"ok": false, "error": "..."}`'
  - id: 'API-002'
    status: 'TODO'
    title: 'Crea connection senza campi obbligatori → 422'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'api'
    assertion: '422 con `detail` strutturato (validation errors)'
  - id: 'API-003'
    status: 'TODO'
    title: 'Crea connection duplicata (stesso name/group) → 409'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'api'
    assertion: '409 conflict'
  - id: 'API-004'
    status: 'TODO'
    title: 'Update connection ruota password'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'api'
          - 'password'
    assertion: 'nuova password usata, vecchia non più valida'
  - id: 'API-005'
    status: 'TODO'
    title: 'Delete connection con datasource collegato → 409 o cascade?'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'api'
          - 'cleanup'
    assertion: 'comportamento documentato (409 se referenced)'
  - id: 'API-006'
    status: 'TODO'
    title: 'List connections per gruppo (paginazione)'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'api'
          - 'pagination'
    assertion: 'page+size rispettati, total corretto'
  - id: 'API-007'
    status: 'TODO'
    title: 'Read-only utente non può creare connection → 403'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'api'
    assertion: '403'
  - id: 'API-008'
    status: 'TODO'
    title: 'Cross-group access negato → 403'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'api'
          - 'tenancy'
    assertion: 'utente di group A non vede risorse di group B'
  - id: 'API-009'
    status: 'TODO'
    title: 'Esegui canvas non valido (riferimento a connection cancellata) → errore controllato'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'api'
    assertion: 'run status=failed, error message strutturato, no 500'
  - id: 'API-010'
    status: 'TODO'
    title: 'Schedule CRUD (create, update, disable, delete)'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'api'
          - 'cleanup'
    assertion: 'ogni operazione ritorna lo stato atteso'
  - id: 'API-011'
    status: 'TODO'
    title: 'Idempotency-Key su run on-demand'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'api'
          - 'idempotency'
    steps: '2× `POST /canvases/{id}/runs` con stessa Idempotency-Key'
    assertion: 'secondo POST ritorna lo stesso run_id, non ne crea uno nuovo'
  - id: 'API-012'
    status: 'TODO'
    title: 'Audit log: ogni write API genera entry'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'api'
          - 'audit'
    assertion: 'entry con `actor`, `action`, `resource`, `timestamp`'
  - id: 'API-013'
    status: 'TODO'
    title: '`/projects/{id}/validate-all` aggrega errori cross-node'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'api'
    references:
          - 'app/core/projects/router.py'
    steps: '1) crea progetto con 3 canvas, ognuno con almeno un nodo invalido (es. connection cancellata, formula syntax error, riferimento canvas mancante) 2) `POST /projects/{id}/validate-all`'
    assertion: '200 con body `{"valid": false, "errors": [{"canvas_id": ..., "node_id": ..., "error_code": ..., "message": ...}, ...]}`; tutti gli errori dei 3 canvas presenti, no early-exit al primo'
  - id: 'API-014'
    status: 'TODO'
    title: 'DELETE project con dipendenze → 409 con shape `{kind,id,name,project_type}`'
    granularity: 'integration'
    priority: 'must'
    tags:
          - 'api'
          - 'cleanup'
    references:
          - 'app/core/projects/router.py'
    steps: '1) crea progetto referenziato da schedule attivo 2) `DELETE /projects/{id}`'
    assertion: '409 con body `{"detail": {"error_code": "project_has_dependencies", "dependencies": [{"kind": "schedule", "id": <int>, "name": <str>, "project_type": <str>}, ...]}}`; ogni elemento dependencies ha esattamente le 4 chiavi `kind`, `id`, `name`, `project_type`'
  - id: 'API-015'
    status: 'TODO'
    title: 'Validation handler scarta `ctx`+`input` (no PII echo) e supporta dual-shape'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'api'
    references:
          - 'handler `RequestValidationError` globale'
    steps: '`POST /connections` con body contenente password e campi mancanti'
    assertion: '422; response body NON contiene chiavi `ctx` né `input` (no echo del valore inviato → no PII leak); shape conforme a entrambe le varianti `{detail: [...]}` e `{error: ..., message: ..., details: [...]}`; password originale assente in toto'
