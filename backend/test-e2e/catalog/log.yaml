area: 'log'
description: 'Logging strutturato'
tests:
  - id: 'LOG-001'
    status: 'META'
    title: 'Ogni request ha request_id propagato in tutti i log'
    granularity: 'integration'
    priority: 'meta'
    tags:
          - 'logging'
          - 'request-id'
          - 'cross-cutting'
    prereq:
          tests:
                  - 'PREP-002'
    references:
          - 'test-e2e/runner/cross_cutting.py'
    steps: '1) request con header `X-Request-ID: req-test-001` 2) raccogli log app'
    assertion: |
          tutti i log emessi durante quella request hanno field
          `request_id=req-test-001`.
          [META / cross-cutting-policy] Echo response coperto da autouse
          `_global_response_audit`. La propagazione interna ai log
          applicativi richiede ispezione log container e resta verificabile
          come test specifico se la pipeline CI raccoglie i log; la verifica
          del solo header echo e' sufficiente per garantire il contratto
          del middleware.
  - id: 'LOG-002'
    status: 'TODO'
    title: 'Run ha run_id linkabile a tutti i log dei suoi step'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'logging'
    prereq:
          tests:
                  - 'PREP-021'
    assertion: 'filtrando log per `run_id=<id>` si ottengono entry di estrai/manipola/carica nello stesso run; ogni step ha anche `step_id`'
  - id: 'LOG-003'
    status: 'TODO'
    title: 'Log level configurabile via ENV'
    granularity: 'integration'
    priority: 'optional'
    tags:
          - 'logging'
    prereq:
          tests:
                  - 'PREP-001'
    steps: '1) `LOG_LEVEL=DEBUG` restart 2) verifica log debug presenti 3) `LOG_LEVEL=WARNING` 4) verifica solo warning+'
    assertion: 'livello rispettato runtime, no log INFO con level=WARNING'
  - id: 'LOG-004'
    status: 'META'
    title: 'PII (password, api_key, email cliente) NON in log'
    granularity: 'smoke'
    priority: 'meta'
    tags:
          - 'logging'
          - 'password'
          - 'cross-cutting'
    prereq:
          tests:
                  - 'SEC-006'
    references:
          - 'test-e2e/runner/cross_cutting.py'
    steps: 'trigger flow con password/api_key in payload, errore noto'
    assertion: |
          `grep -E "(password|api_key|secret_key)" log` ritorna 0
          occorrenze con valori non redacted.
          [META / cross-cutting-policy] Sostituito da
          `assert_no_pii_in_response` (autouse, su ogni response) e
          `assert_no_pii_in_logs` (helper opt-in per blob di log raccolti
          dal container backend).
  - id: 'LOG-005'
    status: 'TODO'
    title: 'Errore strutturato JSON con error_code, message, context'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'logging'
          - 'json'
    prereq:
          tests:
                  - 'PREP-002'
    steps: 'trigger 422'
    assertion: 'log error entry parsa come JSON e include keys: `timestamp`, `level`, `error_code`, `message`, `context`, `request_id`'
