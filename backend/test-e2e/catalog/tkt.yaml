area: 'tkt'
description: 'Tickets sub-system'
tests:
  - id: 'TKT-001'
    status: 'TODO'
    title: 'Meta endpoint (counts per RBAC scope: superadmin/admin/user)'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'tickets'
          - 'rbac'
    references:
          - 'app/core/tickets/router.py:69-73'
    steps: '`GET /tickets/meta` come superadmin, admin, user normale'
    assertion: 'superadmin vede counts globali (tutti gruppi); admin vede counts del proprio gruppo; user vede counts dei propri ticket; response shape `{open: N, in_progress: M, closed: K, total: T}` per ogni scope; counts coerenti con DB'
  - id: 'TKT-002'
    status: 'TODO'
    title: 'CRUD ticket: create, read, update, list paginato'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'tickets'
    references:
          - 'app/core/tickets/router.py:109,128,180'
    steps: '1) `POST /tickets` 2) `GET /tickets/{id}` 3) `PATCH /tickets/{id}` (status) 4) `GET /tickets?page=1&size=10`'
    assertion: 'POST 201 con `ticket_id`; GET 200 con dati; PATCH 200 con `status` aggiornato e `updated_at` nuovo; LIST 200 con `{items, total, page, size}`; paginazione rispettata'
  - id: 'TKT-003'
    status: 'TODO'
    title: 'Comments: create, list ordinato per timestamp'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'tickets'
    references:
          - 'app/core/tickets/router.py:222'
    steps: '1) `POST /tickets/{id}/comments` 3 volte 2) `GET /tickets/{id}/comments`'
    assertion: 'ogni POST 201; LIST 200 con array ordinato `created_at ASC` (3 elementi nell''ordine di creazione); ogni comment ha `id, author, body, created_at`'
  - id: 'TKT-004'
    status: 'TODO'
    title: 'Attachment upload: MIME allowlist'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'tickets'
    references:
          - 'app/core/tickets/router.py:230'
    steps: 'upload allegato con MIME `image/png`, `image/jpeg`, `image/gif`, `image/webp`, `text/plain`, `text/x-log`; poi prova `application/x-msdownload` (exe)'
    assertion: '6 MIME ammessi → 201; exe → 415 con `error_code=mime_not_allowed`; allowlist esatta `{png, jpg, jpeg, gif, webp, log, txt}`'
  - id: 'TKT-005'
    status: 'TODO'
    title: 'Attachment size cap: > MAX → 413'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'tickets'
          - 'limits'
    references:
          - 'app/core/tickets/router.py:230'
    steps: 'upload allegato con dimensione > `TICKET_ATTACHMENT_MAX_BYTES`'
    assertion: '413 con `error_code=attachment_too_large`; file non scritto su disco/S3'
  - id: 'TKT-006'
    status: 'TODO'
    title: 'Soft delete: ticket marked deleted, non in list di default'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'tickets'
          - 'cleanup'
          - 'soft-delete'
    references:
          - 'app/core/tickets/router.py:252'
    steps: '1) `DELETE /tickets/{id}` 2) `GET /tickets`'
    assertion: '204; ticket ha `deleted_at IS NOT NULL`; LIST default non include ticket; `GET /tickets?include_deleted=true` lo include con flag `deleted=true`'
  - id: 'TKT-007'
    status: 'TODO'
    title: 'Hard delete (admin only): rimosso definitivamente'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'tickets'
          - 'rbac'
          - 'cleanup'
    references:
          - 'app/core/tickets/router.py:264'
    steps: '1) user normale `DELETE /tickets/{id}?hard=true` → 403 2) admin `DELETE /tickets/{id}?hard=true`'
    assertion: 'user → 403; admin → 204; row fisicamente assente in DB; `GET /tickets/{id}?include_deleted=true` → 404'
  - id: 'TKT-008'
    status: 'TODO'
    title: 'Attachment download inline (image preview)'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'tickets'
    references:
          - 'app/core/tickets/router.py:343'
    steps: '`GET /tickets/{id}/attachments/{att_id}` per allegato png'
    assertion: '200 con `Content-Type: image/png` e `Content-Disposition: inline; filename="..."`; payload binario corretto'
  - id: 'TKT-009'
    status: 'TODO'
    title: 'Attachment download attachment per .log/.txt'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'tickets'
    references:
          - 'app/core/tickets/router.py:382'
    steps: '`GET /tickets/{id}/attachments/{att_id}` per allegato .log o .txt'
    assertion: '200 con `Content-Disposition: attachment; filename="..."` (NON inline); browser scarica il file invece di mostrarlo inline'
  - id: 'TKT-010'
    status: 'TODO'
    title: 'Esecutore role 403 su tutti i 12 endpoint write'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'tickets'
          - 'rbac'
    references:
          - 'app/core/tickets/router.py:69-73,109,128,180,222,230,252,264,343,382,431'
    steps: 'utente role `esecutore` (read-only su altri sistemi) tenta i 12 endpoint write tickets (POST ticket, PATCH ticket, DELETE ticket, POST comment, POST attachment, DELETE attachment, ecc.)'
    assertion: 'tutti 12 endpoint → 403 con `error_code=insufficient_role`; esecutore può fare GET (lettura) ma nessuna scrittura'
  - id: 'TKT-011'
    status: 'TODO'
    title: 'Cross-group ticket non visibile (RBAC)'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'tickets'
          - 'tenancy'
          - 'rbac'
    references:
          - 'app/core/tickets/router.py:431'
    steps: '1) user di group A crea ticket T 2) user di group B `GET /tickets/{T}` e `GET /tickets`'
    assertion: 'GET singolo → 404 (tenant-blind); LIST → ticket T assente; user A vede T regolarmente'
