area: 'task'
description: 'Task full-cleanup 207 GDPR'
tests:
  - id: 'TASK-001'
    status: 'TODO'
    title: '4 step idempotenti'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'cleanup'
          - 'gdpr'
          - 'idempotency'
    references:
          - 'app/core/orchestrator/router.py:593-763'
    steps: '`DELETE /tasks/{task_id}/full-cleanup` 2 volte di fila'
    assertion: 'prima 200 con `{steps: {delete_result: ok, unlink_output_file: ok, delete_log_runs: ok, celery_forget: ok}}`; seconda 200 con stessi 4 step `ok` (idempotenti, non re-elimina ma neppure errore); ogni step può essere ri-eseguito senza side effect negativi'
  - id: 'TASK-002'
    status: 'TODO'
    title: '`failed_steps[]` body quando uno step fallisce: 207 multi-status'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'cleanup'
          - 'gdpr'
    references:
          - 'app/core/orchestrator/router.py:593-763'
    steps: 'simulare fallimento di uno step (es. minio offline durante `delete_result`); `DELETE /tasks/{task_id}/full-cleanup`'
    assertion: '207 (Multi-Status); body `{steps: {...}, failed_steps: ["delete_result"], partial: true}`; gli altri 3 step comunque eseguiti'
  - id: 'TASK-003'
    status: 'TODO'
    title: 'Path-traversal guard su `unlink_output_file` (ValueError → step skipped, no panic)'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'cleanup'
          - 'gdpr'
    references:
          - 'app/core/orchestrator/router.py:670-678'
    steps: 'task con `output_file_path` che contiene `../` (es. `/data/results/../../etc/passwd`); cleanup'
    assertion: 'step `unlink_output_file` skipped con reason `path_traversal_blocked`; ValueError catturato (no 500); altri step OK; log `unlink_output_file_skipped path_outside_allowed_root`'
  - id: 'TASK-004'
    status: 'TODO'
    title: 'Fallback admin/superadmin se project già eliminato'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'cleanup'
          - 'gdpr'
          - 'rbac'
    references:
          - 'app/core/orchestrator/router.py:593-763'
    steps: '1) elimina project P 2) task_id T riferiva P 3) admin/superadmin `DELETE /tasks/{T}/full-cleanup`'
    assertion: '200 (NON 404 per project mancante); cleanup procede sui residui (result, file, log_runs, celery) anche senza project; per utente normale → 404; per admin/superadmin → fallback con auth via group_id storico'
  - id: 'TASK-005'
    status: 'TODO'
    title: 'GDPR: tutti i path verificati, no stale references'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'cleanup'
          - 'gdpr'
    references:
          - 'app/core/orchestrator/router.py:593-763'
    steps: '1) crea task con result+file+log_runs+celery_state 2) `DELETE /tasks/{task_id}/full-cleanup` 3) query DB per ogni tabella che potrebbe referenziare task'
    assertion: 'nessuna riga rimanente in `results`, nessun file su filesystem, nessuna entry `log_runs`, nessuno stato celery; query `SELECT * FROM <ogni_tabella> WHERE task_id=T` ritorna 0 righe per ognuna; nessun stale reference (verifica con FK scan + filesystem scan)'
