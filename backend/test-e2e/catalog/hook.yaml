area: 'hook'
description: 'Webhook in entrata'
tests:
  - id: 'HOOK-001'
    status: 'TODO'
    title: 'POST /webhooks/{id} con payload firmato HMAC valido → 200'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'webhook'
          - 'rest'
    prereq:
          tests:
                  - 'PREP-002'
    steps: 'POST con header `X-Signature: sha256=<hmac(secret, body)>` + `X-Timestamp`'
    assertion: '200, evento processato, entry in `webhook_events`'
  - id: 'HOOK-002'
    status: 'TODO'
    title: 'Firma HMAC invalida → 401'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'webhook'
    prereq:
          tests:
                  - 'HOOK-001'
    steps: 'stesso payload, `X-Signature` con secret sbagliato'
    assertion: '401 `error_code=invalid_signature`, no entry in `webhook_events`'
  - id: 'HOOK-003'
    status: 'TODO'
    title: 'Replay attack (timestamp vecchio) → 401'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'webhook'
    prereq:
          tests:
                  - 'HOOK-001'
    steps: 'payload con `X-Timestamp` di 10 min fa'
    assertion: '401 `error_code=stale_timestamp`, finestra accept = 5 min'
  - id: 'HOOK-004'
    status: 'TODO'
    title: 'Payload > MAX → 413'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'webhook'
          - 'limits'
    prereq:
          tests:
                  - 'HOOK-001'
    steps: 'payload > MAX_WEBHOOK_BYTES (es. 1MB)'
    assertion: '413, no parsing del body, log `error_code=webhook_payload_too_large`'
  - id: 'HOOK-005'
    status: 'TODO'
    title: 'Endpoint disabilitato → 404 (anche con firma valida)'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'webhook'
    prereq:
          tests:
                  - 'HOOK-001'
    steps: 'webhook con `enabled=false`, POST con firma corretta'
    assertion: '404 (no leak: non rivela che esiste); audit entry per tentativo'
