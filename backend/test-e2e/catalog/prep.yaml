area: 'prep'
description: 'Preparatori (building block)'
tests:
  - id: 'PREP-001'
    status: 'TODO'
    title: 'Stack docker pronto'
    granularity: 'integration'
    priority: 'must'
    tags:
          - 'setup'
          - 'infra'
    prereq:
          profile: 'core'
    steps: '1) `docker compose up -d` 2) attendi healthcheck 3) ping `fake-rest:8080/health` + `pg_isready` postgres + `redis-cli ping`'
    assertion: 'tutti i container `(healthy)` entro 90s'
  - id: 'PREP-002'
    status: 'TODO'
    title: 'Login utente test'
    granularity: 'integration'
    priority: 'must'
    tags:
          - 'setup'
    prereq:
          profile: 'core'
    steps: '1) `POST /auth/login` con `tester@plenora.test` / pwd 2) salva JWT'
    assertion: '200 + `access_token` + `refresh_token`'
  - id: 'PREP-003'
    status: 'TODO'
    title: 'Crea gruppo di test'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
    prereq:
          tests:
                  - 'PREP-002'
    steps: '`POST /groups` con `name=e2e-<uuid>`'
    assertion: '201 + `group_id`. Salva per il teardown.'
  - id: 'PREP-004'
    status: 'TODO'
    title: 'Crea connection PostgreSQL'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
          - 'postgres'
    prereq:
          tests:
                  - 'PREP-003'
    steps: '`POST /connections` con `type=postgres, host=plenora-e2e-postgres, port=5432, database=plenora_test, user=plenora, password=plenora_test_pwd`'
    assertion: '201 + `connection_id`. Password cifrata at-rest.'
  - id: 'PREP-005'
    status: 'TODO'
    title: 'Crea connection MySQL'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
          - 'mysql'
    prereq:
          profile: 'db'
          tests:
                  - 'PREP-003'
    steps: '`POST /connections` con `type=mysql, host=plenora-e2e-mysql, port=3306, database=plenora_test`'
    assertion: '201 + `connection_id`'
  - id: 'PREP-006'
    status: 'TODO'
    title: 'Crea connection SQL Server'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
          - 'mssql'
    prereq:
          profile: 'db'
          tests:
                  - 'PREP-003'
    assertion: '201'
  - id: 'PREP-007'
    status: 'TODO'
    title: 'Crea connection Oracle'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
          - 'oracle'
    prereq:
          profile: 'db-heavy'
          tests:
                  - 'PREP-003'
    assertion: '201'
  - id: 'PREP-008'
    status: 'TODO'
    title: 'Test connection (ping DB)'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
    prereq:
          tests:
                  - 'PREP-004'
    steps: '`POST /connections/{id}/test`'
    assertion: '200 + `{"ok": true, "latency_ms": <int>}`'
  - id: 'PREP-009'
    status: 'TODO'
    title: 'Schema introspection'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
    prereq:
          tests:
                  - 'PREP-004'
    steps: '`GET /connections/{id}/schemas` → lista schemi → `GET .../schemas/plenora/tables` → lista tabelle'
    assertion: 'vede regions, cities, customers, products, orders, order_items, employees, events_log, routes (9 tabelle)'
  - id: 'PREP-010'
    status: 'TODO'
    title: 'Crea api_connection REST (api_key)'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
          - 'rest'
    prereq:
          tests:
                  - 'PREP-003'
    steps: '`POST /api_connections` con `base_url=http://plenora-e2e-fake-rest:8080, auth_type=api_key, api_key=PLENORA_TEST_KEY, key_location=header(X-API-Key)`'
    assertion: '201 + secret cifrato'
  - id: 'PREP-011'
    status: 'TODO'
    title: 'Crea api_connection REST (OAuth2 client_credentials)'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
          - 'oauth2'
          - 'rest'
    prereq:
          tests:
                  - 'PREP-003'
    steps: '`POST /api_connections` con `auth_type=oauth2_client_credentials, token_url=.../auth/oauth2/token, client_id=plenora, client_secret=plenora_secret`'
    assertion: '201'
  - id: 'PREP-012'
    status: 'TODO'
    title: 'Crea api_connection ArcGIS (token)'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
          - 'arcgis'
          - 'rest'
          - 'auth'
    prereq:
          tests:
                  - 'PREP-003'
    steps: '`POST /api_connections` con `auth_type=arcgis_token, token_url=.../auth/arcgis/generateToken, username=tester, password=tester_pass`'
    assertion: '201'
  - id: 'PREP-013'
    status: 'TODO'
    title: 'Test api_connection (ping REST)'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
          - 'rest'
    prereq:
          tests:
                  - 'PREP-010'
    steps: '`POST /api_connections/{id}/test`'
    assertion: '200, auth negotiated'
  - id: 'PREP-014'
    status: 'TODO'
    title: 'Crea datasource FTP'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
          - 'ftp'
    prereq:
          profile: 'files'
          tests:
                  - 'PREP-003'
    steps: '`POST /datasources` con `type=ftp, host=plenora-e2e-ftp, port=21, username=tester, password=plenora_ftp_pwd, base_path=/fixtures`'
    assertion: '201'
  - id: 'PREP-015'
    status: 'TODO'
    title: 'Crea datasource SFTP'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
          - 'sftp'
    prereq:
          profile: 'files'
          tests:
                  - 'PREP-003'
    assertion: '201'
  - id: 'PREP-016'
    status: 'TODO'
    title: 'List file datasource'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
    prereq:
          tests:
                  - 'PREP-014'
                  - 'PREP-015'
    steps: '`GET /datasources/{id}/files?path=/fixtures/csv`'
    assertion: 'lista file con metadata (size, mtime)'
  - id: 'PREP-017'
    status: 'TODO'
    title: 'Crea connection cloud S3 (MinIO)'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
          - 's3'
    prereq:
          profile: 'cloud'
          tests:
                  - 'PREP-003'
    steps: '`POST /connections` con `type=s3, endpoint=http://plenora-e2e-minio:9000, access_key=plenora_minio, secret_key=plenora_minio_pwd, bucket=plenora-test`'
    assertion: '201'
  - id: 'PREP-018'
    status: 'TODO'
    title: 'Crea progetto vuoto'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
    prereq:
          tests:
                  - 'PREP-003'
    steps: '`POST /projects` con `name=e2e-test, group_id=<da PREP-003>`'
    assertion: '201 + `project_id`'
  - id: 'PREP-019'
    status: 'TODO'
    title: 'Crea canvas vuoto'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
    prereq:
          tests:
                  - 'PREP-018'
    steps: '`POST /projects/{id}/canvases` con `name=canvas1, definition={}`'
    assertion: '201 + `canvas_id`'
  - id: 'PREP-020'
    status: 'TODO'
    title: 'Salva canvas con nodi (estrai semplice)'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
    prereq:
          tests:
                  - 'PREP-019'
                  - 'PREP-004'
    steps: '`PUT /canvases/{id}` con definition contenente 1 nodo "estrai customers"'
    assertion: '200, definition persistita'
  - id: 'PREP-021'
    status: 'TODO'
    title: 'Esegui canvas (run on-demand)'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
    prereq:
          tests:
                  - 'PREP-020'
    steps: '`POST /canvases/{id}/runs` → poll `GET /runs/{run_id}` fino a status=success'
    assertion: 'run completato, `result_id` presente'
  - id: 'PREP-022'
    status: 'TODO'
    title: 'Recupera result preview'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
    prereq:
          tests:
                  - 'PREP-021'
    steps: '`GET /results/{result_id}/preview?limit=50`'
    assertion: '200 + righe + schema'
  - id: 'PREP-023'
    status: 'TODO'
    title: 'Cleanup gruppo (cascade)'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'setup'
          - 'cleanup'
    prereq:
          tests:
                  - 'PREP-003'
    steps: '`DELETE /groups/{group_id}`'
    assertion: '200 + report con counts (schedules, projects, datasources, connections, file_sources, users, results, intermediate_runs, log_runs). DB target verificato vuoto.'
