area: 'sys'
description: 'Admin system-status dashboard'
tests:
  - id: 'SYS-001'
    status: 'TODO'
    title: 'Backup block: ultimo backup + verify_restore status'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'admin'
          - 'backup'
          - 'soft-delete'
    references:
          - 'app/core/admin_system_status/service.py'
    steps: '`GET /admin/system-status`'
    assertion: 'response include `backup: {last_backup_at, last_backup_size_bytes, last_verify_restore_at, last_verify_restore_status: "ok"|"failed"|"never_run"}`'
  - id: 'SYS-002'
    status: 'TODO'
    title: 'Schedules failing 7gg block: count + lista'
    granularity: 'integration'
    priority: 'optional'
    tags:
          - 'admin'
    references:
          - 'app/core/admin_system_status/service.py'
    steps: '1) crea 3 schedule con run failed in ultimi 7gg 2) `GET /admin/system-status`'
    assertion: 'response include `failing_schedules: {count: 3, items: [{schedule_id, name, last_failure_at, failure_count_7d}]}`; only ultimi 7 giorni'
  - id: 'SYS-003'
    status: 'TODO'
    title: 'Workers Celery online block (heartbeat)'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'admin'
          - 'scheduler'
          - 'celery'
    references:
          - 'app/core/admin_system_status/service.py'
    steps: '`GET /admin/system-status` con N worker online'
    assertion: 'response include `celery_workers: {online_count: N, workers: [{name, last_heartbeat_at, queues: [...], active_tasks: M}]}`; killare un worker → online_count decrementa'
  - id: 'SYS-004'
    status: 'TODO'
    title: 'Host resources block (psutil): CPU/mem 80%/92%/95% threshold'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'admin'
    references:
          - 'app/core/admin_system_status/service.py'
    steps: '`GET /admin/system-status` con CPU=70/85/93/96%'
    assertion: 'response include `host: {cpu_percent, memory_percent, status}`; status `ok` (<80%), `warning` (80-92%), `critical` (92-95%), `down` (>=95%); thresholds esatti'
  - id: 'SYS-005'
    status: 'TODO'
    title: 'DB pool block: usage% > 80%'
    granularity: 'integration'
    priority: 'optional'
    tags:
          - 'admin'
    references:
          - 'app/core/admin_system_status/service.py'
    steps: '1) saturare pool al 50%, 81%, 95% 2) `GET /admin/system-status`'
    assertion: 'response include `db_pool: {size, in_use, available, usage_percent, status}`; status `ok` (<80%), `warning` (>=80%); valori coerenti con `pg_stat_activity`'
  - id: 'SYS-006'
    status: 'TODO'
    title: 'Redis memory block'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'admin'
          - 'redis'
    references:
          - 'app/core/admin_system_status/service.py'
    steps: '`GET /admin/system-status`'
    assertion: 'response include `redis: {used_memory_bytes, used_memory_human, maxmemory_bytes, usage_percent}`; valori da `INFO memory`'
  - id: 'SYS-007'
    status: 'TODO'
    title: 'DB schema size block'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'admin'
    references:
          - 'app/core/admin_system_status/service.py'
    steps: '`GET /admin/system-status`'
    assertion: 'response include `db_schema: {total_bytes, total_human, by_table: [{table, bytes}]}`; somma by_table coerente con total'
  - id: 'SYS-008'
    status: 'TODO'
    title: 'JWT blacklist counters'
    granularity: 'integration'
    priority: 'optional'
    tags:
          - 'admin'
          - 'auth'
    references:
          - 'app/core/admin_system_status/service.py'
          - 'app/shared/token_blacklist.py'
    steps: '1) blacklist N token via logout 2) `GET /admin/system-status`'
    assertion: 'response include `jwt_blacklist: {entries_count: N, expired_count, oldest_at, newest_at}`; entries_count coerente con redis/DB store'
  - id: 'SYS-009'
    status: 'TODO'
    title: 'Graceful degradation: 1 blocco fallisce → response include error per blocco, non 500 globale'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'admin'
    references:
          - 'app/core/admin_system_status/router.py'
    steps: 'stop redis (block redis fallisce); `GET /admin/system-status`'
    assertion: '200 (NON 500); blocco redis ha shape `{error: "redis_unavailable", message: ...}` invece di dati; altri blocchi (backup, host, db_pool, ...) presenti e completi; tutti i blocchi tentati indipendentemente'
