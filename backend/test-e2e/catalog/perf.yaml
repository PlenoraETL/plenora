area: 'perf'
description: 'Performance / soglie'
tests:
  - id: 'PERF-001'
    status: 'TODO'
    title: 'Estrai 10k events_log → < 30s, peak memoria < 500MB'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'performance'
    prereq:
          tests:
                  - 'EXT-006'
    references:
          - 'app/db/query_streaming.py'
    assertion: 'wall-time < 30s; RSS peak worker < 500MB (misurato via cgroup o `psutil`)'
  - id: 'PERF-002'
    status: 'TODO'
    title: 'Carica batch 50k records via REST sink → throughput > 1000 rec/s'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'performance'
          - 'rest'
    prereq:
          tests:
                  - 'LOAD-005'
    assertion: 'tempo totale < 50s; rate logged > 1000 rec/s; no 429 dal sink'
  - id: 'PERF-003'
    status: 'TODO'
    title: 'API GET /canvases con 1000 canvas in gruppo → < 1s con paginazione'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'performance'
          - 'pagination'
    prereq:
          tests:
                  - 'PREP-018'
    steps: '`GET /canvases?page=1&size=50`'
    assertion: 'response < 1s p95; payload size sano; query DB usa LIMIT/OFFSET o keyset'
  - id: 'PERF-004'
    status: 'TODO'
    title: 'Schema introspection su DB con 500 tabelle → < 5s'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'performance'
    prereq:
          tests:
                  - 'PREP-009'
    assertion: '`GET /connections/{id}/schemas/.../tables` ritorna in < 5s; cache hit-rate > 0 al secondo invocato'
  - id: 'PERF-005'
    status: 'TODO'
    title: 'Search canvas full-text su 10k canvas → < 2s'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'performance'
    steps: '`GET /canvases?q=customers`'
    assertion: 'response < 2s; uso indice `pg_trgm` o `tsvector` confermato in EXPLAIN'
