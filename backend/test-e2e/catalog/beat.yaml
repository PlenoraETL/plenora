area: 'beat'
description: 'Celery beat scheduler'
tests:
  - id: 'BEAT-001'
    status: 'TODO'
    title: 'Leader election Redis SETNX TTL=120s'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'scheduler'
          - 'redis'
    references:
          - 'workers/beat_scheduler.py:124-228'
    steps: '1) avvia 2 istanze beat puntate allo stesso redis 2) ispeziona chiave `plenora:beat:leader` con `redis-cli`'
    assertion: 'chiave creata con `SET NX EX 120`; valore = identità della prima istanza; TTL <=120 e >0; seconda istanza in stato follower (log `not leader, follower`)'
  - id: 'BEAT-002'
    status: 'TODO'
    title: 'Refresh leader on tick'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'scheduler'
    references:
          - 'workers/beat_scheduler.py:124-228'
    steps: '1) leader attivo 2) campiona TTL chiave `plenora:beat:leader` ogni 10s per 60s'
    assertion: 'TTL refreshato a ~120s ad ogni tick; mai sceso sotto soglia critica (es. < 30s); valore della chiave invariato (stesso owner)'
  - id: 'BEAT-003'
    status: 'TODO'
    title: 'Fail-CLOSED default: 2 beat → 1 leader, no doppi enqueue'
    granularity: 'integration'
    priority: 'must'
    tags:
          - 'scheduler'
    references:
          - 'workers/beat_scheduler.py:124-228'
    steps: '1) `SCHEDULE_BEAT_LEADER_FAIL_OPEN=False` (default) 2) 2 beat concorrenti 3) crea schedule che enqueue task con marker univoco'
    assertion: 'tick attesi N → enqueue conteggio = N (non 2N); follower NON enqueue task; log follower `skipped, not leader`'
  - id: 'BEAT-004'
    status: 'TODO'
    title: '`SCHEDULE_BEAT_LEADER_FAIL_OPEN=True` fallback in-memory ammesso'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'scheduler'
    references:
          - 'workers/beat_scheduler.py:124-228'
    steps: '1) `SCHEDULE_BEAT_LEADER_FAIL_OPEN=True` 2) stop redis 3) avvio singolo beat'
    assertion: 'beat usa lock in-memory; tick procedono; log `redis unavailable, fail-open in-memory lock`; quando redis torna, riprende SETNX'
  - id: 'BEAT-005'
    status: 'TODO'
    title: 'Telemetria transitions su Redis hash'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'scheduler'
          - 'redis'
    references:
          - 'workers/beat_scheduler.py:124-228'
    steps: '1) leader attivo 2) kill leader → second instance promote 3) ispeziona `HGETALL plenora:beat:telemetry`'
    assertion: 'hash contiene chiavi `last_leader_acquired_at`, `last_leader_lost_at`, `transition_count` (>=1 dopo kill); transition_count incrementato a ogni cambio leader'
  - id: 'BEAT-006'
    status: 'TODO'
    title: 'Schedule healthcheck stato `{ok, warning, down, unknown}` threshold 180s'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'scheduler'
          - 'infra'
    references:
          - 'app/core/scheduler/router.py:53-107'
    steps: '`GET /scheduler/healthcheck` con beat heartbeat di 0s, 100s, 200s, mai inviato'
    assertion: '0s → `ok`; 100s → `ok`; 200s (> 180s) → `warning`; molto stale (>2× threshold) → `down`; mai → `unknown`; response include `last_heartbeat_at` e `seconds_since`'
