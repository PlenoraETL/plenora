area: 'clean'
description: 'Beat cleanup jobs'
tests:
  - id: 'CLEAN-001'
    status: 'TODO'
    title: 'Eseguibili outputs > 2h rimossi'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'cleanup'
          - 'eseguibili'
    references:
          - 'workers/beat_scheduler.py:646-801'
    steps: '1) crea file in `eseguibili_outputs/` con mtime di -3h 2) trigger beat cleanup'
    assertion: 'file rimosso; file con mtime di -1h preservato; log `cleanup_eseguibili_outputs removed=1 kept=1`'
  - id: 'CLEAN-002'
    status: 'TODO'
    title: 'IMDF bundles TTL 48h'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'cleanup'
          - 'imdf'
    references:
          - 'workers/beat_scheduler.py:646-801'
    steps: '1) crea bundle in `imdf_bundles/` con mtime -49h 2) altro con mtime -47h 3) trigger cleanup'
    assertion: 'bundle -49h rimosso; -47h preservato; log `cleanup_imdf_bundles ttl_hours=48`'
  - id: 'CLEAN-003'
    status: 'TODO'
    title: '`DATA_DIR/temp` orfani > 24h con `eseguibili_uploads/*` recursive'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'cleanup'
          - 'eseguibili'
    references:
          - 'workers/beat_scheduler.py:646-801'
    steps: '1) crea albero `DATA_DIR/temp/eseguibili_uploads/<task>/file.dat` con mtime -25h 2) altro con mtime -10h 3) trigger cleanup'
    assertion: 'cartella -25h rimossa ricorsivamente (file + parent dir vuota); -10h preservata; rimozione esplora ricorsivamente `eseguibili_uploads/*`'
