area: 'conc'
description: 'Concorrenza / race conditions'
tests:
  - id: 'CONC-001'
    status: 'TODO'
    title: 'Due utenti POST canvas con stesso name/group → 1 success + 1 conflict'
    granularity: 'integration'
    priority: 'optional'
    tags:
          - 'concurrency'
    prereq:
          tests:
                  - 'PREP-018'
    references:
          - 'app/core/canvases/router.py'
    steps: '1) due richieste `POST /projects/{id}/canvases` simultanee con `name=race-canvas` 2) raccogli risposte'
    assertion: 'una risposta 201 con `canvas_id`, una 409 conflict; in DB esiste 1 sola riga'
  - id: 'CONC-002'
    status: 'TODO'
    title: 'Due update simultanei stesso canvas → optimistic lock version mismatch'
    granularity: 'integration'
    priority: 'optional'
    tags:
          - 'concurrency'
    prereq:
          tests:
                  - 'PREP-019'
    steps: '1) GET canvas → version=N 2) due `PUT /canvases/{id}` con if-match version=N'
    assertion: 'prima PUT 200 + version=N+1, seconda PUT 409 con `error_code=version_mismatch`'
  - id: 'CONC-003'
    status: 'TODO'
    title: 'Due run on-demand stesso canvas con stessa Idempotency-Key → 1 run creato'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'concurrency'
          - 'idempotency'
    prereq:
          tests:
                  - 'PREP-020'
    references:
          - 'API-011 (idempotency baseline'
    steps: '2× `POST /canvases/{id}/runs` con header `Idempotency-Key: race-key-001` in parallelo'
    assertion: 'entrambe le risposte ritornano stesso `run_id`; in `log_runs` esiste 1 sola entry'
  - id: 'CONC-004'
    status: 'TODO'
    title: 'Lock cleanup quando worker celery crash a metà run'
    granularity: 'integration'
    priority: 'optional'
    tags:
          - 'concurrency'
          - 'celery'
          - 'cleanup'
    prereq:
          tests:
                  - 'PREP-021'
    references:
          - 'app/core/scheduler/scheduler_lock.py'
    steps: '1) avvia run lungo 2) `docker kill` worker celery durante esecuzione 3) attendi TTL'
    assertion: 'lock rilasciato dopo TTL, run marcato `failed` con `error_code=worker_crashed`, no riga "running" stale'
  - id: 'CONC-005'
    status: 'TODO'
    title: 'Lock TTL scaduto rilasciato e riacquisibile'
    granularity: 'integration'
    priority: 'optional'
    tags:
          - 'concurrency'
    prereq:
          tests:
                  - 'PREP-002'
    references:
          - 'app/core/scheduler/scheduler_lock.py'
    steps: '1) acquisisci lock con TTL=2s 2) attendi 3s 3) un secondo processo tenta acquire'
    assertion: 'secondo acquire OK; primo holder al successivo refresh riceve `lock_lost`'
  - id: 'CONC-006'
    status: 'TODO'
    title: 'Schedule cron tick sovrapposto: prevenzione doppia esecuzione'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'concurrency'
          - 'scheduler'
    prereq:
          tests:
                  - 'SCH-004'
    references:
          - 'workers/beat_scheduler.py'
    steps: 'schedule con run lungo 2× tick interval'
    assertion: 'secondo tick rileva run in corso, salta con log `skipped_overlapping_run`'
