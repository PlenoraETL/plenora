area: 'size'
description: 'Edge case dimensioni'
tests:
  - id: 'SIZE-001'
    status: 'TODO'
    title: 'File CSV 100MB → streaming letto, no OOM'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'limits'
          - 'csv'
          - 'streaming'
    prereq:
          tests:
                  - 'EXT-010'
    assertion: 'parsing completo, RSS worker < 300MB picco (no full-load in memoria)'
  - id: 'SIZE-002'
    status: 'TODO'
    title: 'Query result 1M righe → streaming fetchmany cap rispettato'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'limits'
          - 'streaming'
    prereq:
          tests:
                  - 'QSTR-001'
    references:
          - 'app/db/query_streaming.py:35-110'
    assertion: '`fetchmany(CHUNK_SIZE)` invocato; memoria stabile; cap MAX_STREAMING_ROWS rispettato'
  - id: 'SIZE-003'
    status: 'TODO'
    title: 'Batch sink 50k records → split in chunk se cap configurato'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'limits'
    prereq:
          tests:
                  - 'LOAD-005'
    assertion: '50 POST eseguiti, ognuno con 1000 record; response 202 per ogni batch'
  - id: 'SIZE-004'
    status: 'TODO'
    title: 'File upload > MAX_UPLOAD_BYTES → 413'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'limits'
    prereq:
          tests:
                  - 'PREP-014'
    references:
          - 'app/config.py'
    steps: 'upload file di dimensione > limit'
    assertion: '413 `error_code=upload_too_large`, file non scritto'
  - id: 'SIZE-005'
    status: 'TODO'
    title: 'Result oggetto > RESULT_DB_HARD_CAP_BYTES → spillover su minio'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'limits'
          - 's3'
    prereq:
          tests:
                  - 'LOAD-009'
    references:
          - 'app/config.py'
    assertion: 'result row contiene riferimento a object_storage; payload non in DB'
  - id: 'SIZE-006'
    status: 'TODO'
    title: 'Canvas JSON > limite → 413 o validazione'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'limits'
          - 'json'
    prereq:
          tests:
                  - 'PREP-019'
    steps: '`PUT /canvases/{id}` con definition > 5MB'
    assertion: '413 o 422 con `error_code=canvas_definition_too_large`'
  - id: 'SIZE-007'
    status: 'TODO'
    title: '`MemoryLimitExceeded` mappato a 413 input cap (upload)'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'limits'
    references:
          - 'handler `MemoryLimitExceeded` → response 413'
    steps: 'upload file a endpoint con cap input < dimensione'
    assertion: '413 con `error_code=memory_limit_exceeded` e `cause=input_cap`'
  - id: 'SIZE-008'
    status: 'TODO'
    title: '`MemoryLimitExceeded` mappato a 503 worker_rss'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'limits'
          - 'celery'
    references:
          - 'worker memory guard'
    steps: 'trigger run con working set previsto > `WORKER_RSS_CAP_BYTES`'
    assertion: '503 con `error_code=memory_limit_exceeded` e `cause=worker_rss`; run marked `failed`'
  - id: 'SIZE-009'
    status: 'TODO'
    title: '`MemoryLimitExceeded` mappato a stage row-count cap (estrai)'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'limits'
    references:
          - 'row-count guard nei nodi estrai/manipola'
    steps: 'canvas con `MAX_STAGE_ROWS=1000`, source con 5000 righe'
    assertion: 'run failed con `error_code=memory_limit_exceeded`, `cause=stage_row_count`, `stage=<node_id>`, `limit=1000`, `observed>=1000`'
  - id: 'SIZE-010'
    status: 'TODO'
    title: '`MemoryLimitExceeded` mappato a stage row-count cap (manipola/carica)'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'limits'
    references:
          - 'SIZE-009'
    steps: 'canvas con join che esplode oltre cap stage; manipola+carica'
    assertion: 'errore identico a SIZE-009 ma `stage` punta al nodo manipola/carica responsabile'
  - id: 'SIZE-011'
    status: 'TODO'
    title: 'Preview limit hard cap 10k righe'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'limits'
    references:
          - 'app/core/results/router.py'
    steps: '`GET /results/{id}/preview?limit=99999`'
    assertion: '200 con `len(rows) <= 10000`; response include `truncated: true` quando full > 10000; richiesta con `?limit=20000` ritorna esattamente 10000 righe'
