area: 'ssrf'
description: ''
tests:
  - id: 'SSRF-001'
    status: 'TODO'
    title: 'API connections test `_validate_external_url` blocca AWS metadata IP'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'security'
          - 'ssrf'
    references:
          - 'app/core/api_connections/router.py:_validate_external_url'
          - 'app/core/security/outbound_url.py'
    steps: '`POST /api_connections/test` con `base_url=http://169.254.169.254/latest/meta-data/`'
    assertion: '422 con `error_code=outbound_url_blocked`; richiesta HTTP NON inviata (mocked egress assente da log)'
  - id: 'SSRF-002'
    status: 'TODO'
    title: '`_validate_external_url` blocca localhost/loopback varianti'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'security'
          - 'ssrf'
    references:
          - 'app/core/api_connections/router.py:_validate_external_url'
    steps: 'per ognuno di `http://localhost`, `http://127.0.0.1`, `http://[::1]`, `http://0.0.0.0` chiamare `POST /api_connections/test`'
    assertion: 'tutte 4 → 422 con `error_code=outbound_url_blocked`; nessuna connessione tentata'
  - id: 'SSRF-003'
    status: 'TODO'
    title: '`CredentialUnavailableError` durante validate-external-url → 422'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'security'
          - 'ssrf'
    references:
          - 'app/core/api_connections/router.py:_validate_external_url'
    steps: '`POST /api_connections/test` per cloud secret backend con credenziali mancanti (es. SSM con AWS creds vuote)'
    assertion: '422 (NON 500) con `error_code=cloud_credentials_unavailable`; messaggio non contiene stack trace; audit log registra il tentativo'
