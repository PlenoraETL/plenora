    title: 'Oracle CLOB auto-promote per stringhe > 4000'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'carica'
          - 'oracle'
    references:
          - 'app/core/carica/ddl_generator.py:296-305'
    dataset: 'input con stringa 5000 caratteri'
    assertion: 'colonna creata come CLOB, valore preservato'
  - id: 'LOAD-011'
    status: 'TODO'
    title: 'MySQL 8.0 SRID syntax `/*!80003 SRID 4326 */`'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'carica'
          - 'mysql'
          - 'spatial'
    references:
          - 'app/core/carica/ddl_generator.py:253'
    assertion: 'DDL generato include comment SRID, SELECT geometry retorna SRID atteso'
  - id: 'LOAD-012'
    status: 'TODO'
    title: 'Oracle truncate-insert via DBMS_REDEFINITION'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'carica'
          - 'oracle'
    references:
          - 'app/core/carica/writer_oracle_redef.py'
    assertion: 'redef completata, righe sostituite atomicamente'
  - id: 'LOAD-013'
    status: 'TODO'
    title: 'PostgreSQL JSONB roundtrip'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'carica'
          - 'postgres'
    references:
          - 'app/core/intermediate/node_snapshots_db.py'
          - 'app/core/files/db.py'
    assertion: 'dict Python → `::jsonb` cast nell''INSERT, deserialize automatico in lettura'
  - id: 'LOAD-014'
    status: 'TODO'
    title: 'Auto-mapping column-type dispatch + `suggest_match_columns`'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'carica'
          - 'spatial'
    references:
          - 'app/core/carica/auto_mapping.py'
          - 'app/core/carica/match_suggester.py'
    steps: '1) source con colonne `customer_id BIGINT, email VARCHAR(255), created_at TIMESTAMP, geom GEOMETRY` 2) `POST /carica/auto-map` con target table 3) `POST /carica/suggest-match-columns`'
    assertion: 'auto-map dispatcha al type-handler corretto (BIGINT→bigint, VARCHAR→varchar(N), TIMESTAMP→timestamptz, GEOMETRY→geometry(SRID)); `suggest_match_columns` ritorna lista candidati con score numerico (0.0–1.0), top match = colonne con stesso nome+type; almeno una match con score >= 0.9'
  - id: 'LOAD-015'
    status: 'TODO'
    title: 'Check-conflicts su `source_connection_id`+`source_table`'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'carica'
    references:
          - 'app/core/carica/conflict_checker.py'
    steps: '1) crea due nodi carica che scrivono sulla stessa target con stesso `source_connection_id` + `source_table` 2) `POST /carica/check-conflicts`'
    assertion: '200 con `conflicts: [{"source_connection_id": ..., "source_table": ..., "node_ids": [N1, N2], "kind": "duplicate_source"}]`; coppia (source_connection_id, source_table) usata come chiave'
