area: 'res'
description: 'Resilienza / partial failure'
tests:
  - id: 'RES-001'
    status: 'TODO'
    title: 'DB target offline durante carica → run failed, no orphan rows'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'resilience'
    prereq:
          tests:
                  - 'LOAD-001'
    steps: '1) avvia canvas con load Postgres 2) `docker stop` postgres target a metà 3) attendi run end'
    assertion: 'run `status=failed`, `error_code=db_unavailable`, conteggio righe target = 0 (rollback completo)'
  - id: 'RES-002'
    status: 'TODO'
    title: 'REST endpoint timeout in arricchisci → retry policy applicata'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'resilience'
          - 'rest'
    prereq:
          tests:
                  - 'ENR-005'
    references:
          - 'app/core/arricchisci/executor.py'
    dataset: '`fake-rest:8080/slow/delay/30` con timeout=10s, retry=3'
    assertion: '3 tentativi loggati con backoff esponenziale, run marcato `failed` con `error_code=timeout`'
  - id: 'RES-003'
    status: 'TODO'
    title: 'Worker celery killed a metà run → cleanup e marcatura failed'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'resilience'
          - 'celery'
          - 'cleanup'
    prereq:
          tests:
                  - 'PREP-021'
    references:
          - 'app/core/scheduler/scheduler_lock.py'
    steps: '1) start run 2) `docker kill -SIGKILL` celery worker 3) attendi watchdog'
    assertion: 'dopo TTL run `status=failed`, intermediate snapshot puliti, no lock orfani'
  - id: 'RES-004'
    status: 'TODO'
    title: 'Scheduler beat down per 1h → recovery, run schedulati ancora attivi'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'resilience'
          - 'scheduler'
    prereq:
          tests:
                  - 'SCH-001'
    steps: '1) crea schedule cron `*/5 * * * *` 2) stop beat 1h 3) restart beat'
    assertion: 'schedule riprende ai tick successivi, run mancati documentati come `skipped` (no flood backfill)'
  - id: 'RES-005'
    status: 'TODO'
    title: 'DB connection pool esaurito → 503 graceful'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'resilience'
    prereq:
          tests:
                  - 'PREP-002'
    references:
          - 'app/db/'
    steps: 'saturare pool con N richieste lunghe (N = pool_size + overflow + 1)'
    assertion: 'ultima richiesta 503 con `error_code=pool_exhausted`, no traceback nudo, app rimane viva'
  - id: 'RES-006'
    status: 'TODO'
    title: 'Storage policy hybrid: minio offline → fallback DB'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'resilience'
          - 's3'
    prereq:
          tests:
                  - 'LOAD-009'
    references:
          - 'app/infrastructure/storage/'
    steps: '1) policy `hybrid` 2) `docker stop` minio 3) esegui canvas con result < hard_cap'
    assertion: 'result salvato su DB, log `warning=object_storage_unavailable_fallback_db`, run success'
