area: 'perm'
description: 'Permission matrix'
tests:
  - id: 'PERM-001'
    status: 'TODO'
    title: 'Viewer vede progetti gruppo, non li edita'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'rbac'
    prereq:
          tests:
                  - 'PREP-003'
    steps: '`GET /projects` OK; `POST/PUT/DELETE` sui progetti'
    assertion: 'GET 200; mutations 403 con `error_code=insufficient_role`'
  - id: 'PERM-002'
    status: 'TODO'
    title: 'Editor crea canvas, non gestisce gruppo'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'rbac'
    prereq:
          tests:
                  - 'PREP-003'
    steps: '`POST /canvases` OK; `POST /groups/{id}/users` 403'
    assertion: 'editor può modificare risorse del gruppo ma non gestire membership'
  - id: 'PERM-003'
    status: 'TODO'
    title: 'Admin gestisce gruppo, non gestisce sistema'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'rbac'
    prereq:
          tests:
                  - 'PREP-003'
    steps: 'admin invita user al gruppo OK; `POST /admin/system/*` 403'
    assertion: 'admin scope = gruppo, no escalation a system endpoint'
  - id: 'PERM-004'
    status: 'TODO'
    title: 'SuperAdmin attraversa tutti i gruppi'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'rbac'
    steps: 'superadmin `GET /connections` con cross-group flag'
    assertion: 'response include risorse di tutti i gruppi; audit log entry per accesso cross-group'
  - id: 'PERM-005'
    status: 'TODO'
    title: 'Role escalation tentata via direct DB write → audit trigger'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'rbac'
          - 'audit'
    prereq:
          tests:
                  - 'PREP-002'
    steps: 'tentare UPDATE diretto su `users.role` via SQL injection o endpoint vulnerabile'
    assertion: 'tentativo bloccato a livello applicativo; se DB write avviene, trigger inserisce entry `audit_log.action=role_escalation_detected`'
  - id: 'PERM-006'
    status: 'TODO'
    title: 'Cambio ruolo durante sessione attiva → enforcement immediato'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'rbac'
          - 'auth'
    prereq:
          tests:
                  - 'PERM-001'
    steps: '1) viewer ottiene JWT 2) admin promuove viewer→editor 3) viewer riusa stesso JWT per `POST /canvases`'
    assertion: 'o JWT contiene claim ruolo (allora 403 finché refresh) o enforcement DB-side (allora 200 immediato); comportamento documentato'
