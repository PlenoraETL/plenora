area: 'int'
description: 'Data integrity'
tests:
  - id: 'INT-001'
    status: 'TODO'
    title: 'INSERT con FK violation → 422, rollback'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'integrity'
    prereq:
          tests:
                  - 'PREP-004'
    steps: 'tentare INSERT in `customers` con `city_id` non esistente'
    assertion: '422 `error_code=foreign_key_violation`, count customers invariato'
  - id: 'INT-002'
    status: 'TODO'
    title: 'UPDATE con CHECK constraint violation → errore mappato'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'integrity'
    prereq:
          tests:
                  - 'PREP-004'
    dataset: '`orders.total_amount > 0` come CHECK'
    assertion: 'UPDATE con total_amount=-10 → 422 `error_code=check_constraint_violation`, riga invariata'
  - id: 'INT-003'
    status: 'TODO'
    title: 'DELETE cascade rispetta FK su catena 14 tabelle'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'integrity'
          - 'cleanup'
    prereq:
          tests:
                  - 'PREP-023'
    references:
          - 'delete_users_for_group'
    assertion: 'dopo cascade, conteggio = 0 in tutte le 14 tabelle child documentate; no FK orphan rilevato da query di sanità'
  - id: 'INT-004'
    status: 'TODO'
    title: 'Transaction rollback su errore parziale (carica fallisce metà → 0 righe scritte)'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'integrity'
    prereq:
          tests:
                  - 'LOAD-001'
    steps: '1) inject errore al record N/2 (es. constraint violation) 2) attendi run'
    assertion: 'target table count = 0 (no commit parziale), run `status=failed`'
  - id: 'INT-005'
    status: 'TODO'
    title: 'UNIQUE constraint su email customers preservato post-NULL row'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'integrity'
    prereq:
          tests:
                  - 'PREP-004'
    dataset: 'customer id=22 con email NULL'
    assertion: 'INSERT secondo customer email=NULL OK (NULL non viola UNIQUE in postgres); INSERT con email duplicata non-NULL → 409'
  - id: 'INT-006'
    status: 'TODO'
    title: 'Decimal precision preservata round-trip (no float drift)'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'integrity'
    prereq:
          tests:
                  - 'EXT-002'
    dataset: '`orders.total_amount` con valori `9999.99`, `0.01`, `123.456`'
    assertion: 'estrai → carica → estrai stesso valore byte-per-byte, no `9999.989999...`'
