area: 'adm'
description: 'Admin / backup'
tests:
  - id: 'ADM-001'
    status: 'TODO'
    title: 'Trigger backup `pg_dump`'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'admin'
          - 'backup'
    references:
          - 'scripts/backup_db.py'
          - 'app/core/admin_backups/service.py:380'
    assertion: 'dump generato, dimensione > 0, restore-test su DB sandbox'
  - id: 'ADM-002'
    status: 'TODO'
    title: 'Lista backup su bucket dedicato `BACKUP_BUCKET`'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'admin'
          - 'backup'
    prereq:
          profile: 'cloud'
    references:
          - 'app/core/admin_backups/service.py:76-86'
    assertion: 'list paginato, metadata size+modified'
  - id: 'ADM-003'
    status: 'TODO'
    title: 'Log archive su `LOG_ARCHIVE_BUCKET` (gzip)'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'admin'
          - 'retention'
    references:
          - 'app/core/scheduler/log_archive.py:272,350'
    assertion: 'dopo retention → log gzippato in bucket dedicato'
  - id: 'ADM-004'
    status: 'TODO'
    title: '`/api/projects/admin/cleanup-orphans` superadmin, dry_run default, cross-DB'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'admin'
          - 'rbac'
          - 'cleanup'
    references:
          - 'app/core/projects/admin_router.py'
    steps: '1) admin (non super) `POST /api/projects/admin/cleanup-orphans` → 403 2) superadmin senza query → 200 con `{"dry_run": true, ...}` 3) superadmin con `?dry_run=false` → 200 con report rimozione cross-DB (postgres + minio)'
    assertion: 'dry_run=true di default (no DELETE eseguito); dry_run=false elimina e response include `removed_counts` per ogni tabella + `removed_objects` per minio; admin non-super → 403 `error_code=insufficient_role`'
