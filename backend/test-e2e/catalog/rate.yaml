area: 'rate'
description: 'Rate limit API'
tests:
  - id: 'RATE-001'
    status: 'TODO'
    title: 'POST /canvases/{id}/runs ripetuto N volte in 1s → 429 dopo soglia'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'rate-limit'
    prereq:
          tests:
                  - 'PREP-021'
    references:
          - 'app/shared/login_rate_limiter.py'
    steps: '50× POST in 1 secondo'
    assertion: 'prime N risposte 202; dalla N+1 → 429 con `Retry-After` header'
  - id: 'RATE-002'
    status: 'TODO'
    title: 'GET /schemas (introspection) ripetuto → rate limit per gruppo, non globale'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'rate-limit'
    prereq:
          tests:
                  - 'PREP-009'
    steps: 'gruppo A satura limit; gruppo B fa GET'
    assertion: 'gruppo A 429; gruppo B 200 (limit isolato per tenant)'
  - id: 'RATE-003'
    status: 'META'
    title: 'Response include header X-RateLimit-Remaining, X-RateLimit-Reset'
    granularity: 'smoke'
    priority: 'meta'
    tags:
          - 'rate-limit'
          - 'cross-cutting'
    prereq:
          tests:
                  - 'RATE-001'
    references:
          - 'test-e2e/runner/cross_cutting.py'
    assertion: |
          ogni response API include `X-RateLimit-Limit`,
          `X-RateLimit-Remaining`, `X-RateLimit-Reset` con valori coerenti.
          [META / cross-cutting-policy] Sostituito da
          `assert_rate_limit_headers_present` (helper opt-in chiamabile da
          qualunque test su endpoint con rate-limit configurato).
  - id: 'RATE-004'
    status: 'TODO'
    title: 'Burst > steady-state ammesso temporaneamente'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'rate-limit'
    prereq:
          tests:
                  - 'RATE-001'
    steps: 'burst di 20 richieste in 1s con rate steady=10/s, burst=20'
    assertion: 'tutte le 20 servite; richiesta 21 in stessa finestra → 429'
  - id: 'RATE-005'
    status: 'TODO'
    title: 'Whitelist IP/utente bypass rate limit'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'rate-limit'
    prereq:
          tests:
                  - 'RATE-001'
    assertion: 'utente whitelist può fare 1000 richieste/s senza 429; header `X-RateLimit-Bypass=true`'
