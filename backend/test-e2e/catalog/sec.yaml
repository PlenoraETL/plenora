area: 'sec'
description: 'Security gates'
tests:
  - id: 'SEC-001'
    status: 'TODO'
    title: 'AntiSSRF: URL privato bloccato'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'security'
    prereq:
          tests:
                  - 'PREP-002'
    references:
          - 'app/core/security/outbound_url.py:34-88'
    steps: 'crea api_connection con `base_url=http://127.0.0.1/`, `http://169.254.169.254/`, `http://10.0.0.1/`, `http://[::1]/`'
    assertion: 'ognuna rifiutata con errore `outbound_url_blocked` o equivalente'
  - id: 'SEC-002'
    status: 'TODO'
    title: 'AntiSSRF: DNS rebinding (host pubblico → IP privato)'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'security'
    prereq:
          tests:
                  - 'PREP-002'
    assertion: 'risoluzione DNS verificata prima della richiesta; se risolve a IP privato → blocco'
  - id: 'SEC-003'
    status: 'TODO'
    title: 'Login rate limit'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'security'
          - 'rate-limit'
    prereq:
          tests:
                  - 'PREP-001'
    references:
          - 'app/shared/login_rate_limiter.py'
    steps: '10× `POST /auth/login` con password sbagliata'
    assertion: 'dopo soglia → 429 con header `Retry-After`'
  - id: 'SEC-004'
    status: 'TODO'
    title: 'Login rate limit fallback in-memory (Redis OFF)'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'security'
          - 'rate-limit'
          - 'redis'
    references:
          - 'app/core/auth/rate_limit_fallback.py:39'
    assertion: 'rate-limit comunque applicato via in-memory backend'
  - id: 'SEC-005'
    status: 'TODO'
    title: 'Token blacklist post-logout'
    granularity: 'integration'
    priority: 'must'
    tags:
          - 'security'
          - 'auth'
    prereq:
          tests:
                  - 'PREP-002'
    references:
          - 'app/shared/token_blacklist.py'
    steps: '1) login → JWT 2) logout 3) richiesta con JWT vecchio'
    assertion: '401 (token blacklisted)'
  - id: 'SEC-006'
    status: 'META'
    title: 'Secret redaction in audit log + error response'
    granularity: 'smoke'
    priority: 'meta'
    tags:
          - 'security'
          - 'audit'
          - 'cross-cutting'
    references:
          - 'app/shared/error_sanitizer.py'
          - 'test-e2e/runner/cross_cutting.py'
    assertion: |
          password / api_key / secret mai presenti in log o response body.
          [META / cross-cutting-policy] Sostituito da
          `assert_no_pii_in_response` (autouse): verifica pattern
          `password|api_key|client_secret|access_token|...` su tutte le
          response (incl. 4xx/5xx) e accetta solo valori redacted. Per i
          log container usare `assert_no_pii_in_logs`.
  - id: 'SEC-007'
    status: 'TODO'
    title: 'Cross-group authorization'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'security'
          - 'tenancy'
    assertion: 'utente di group A non legge/scrive risorse di group B'
