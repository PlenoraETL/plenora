area: 'inf'
description: 'Infra / smoke'
tests:
  - id: 'INF-001'
    status: 'TODO'
    title: '`docker compose up -d` healthcheck OK'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'infra'
    prereq:
          profile: 'full'
    assertion: 'tutti i container `(healthy)` entro 3 min'
  - id: 'INF-002'
    status: 'TODO'
    title: 'Init seed eseguito una sola volta (idempotenza)'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'infra'
          - 'idempotency'
    prereq:
          profile: 'db'
    assertion: 'secondo `up` non duplica righe'
  - id: 'INF-003'
    status: 'TODO'
    title: '`down -v` + `up` ricarica seed'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'infra'
    prereq:
          profile: 'db'
    assertion: 'dataset rigenerato'
  - id: 'INF-004'
    status: 'TODO'
    title: 'Network plenora-e2e: container raggiungibili tra loro'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'infra'
    prereq:
          profile: 'full'
    assertion: 'fake-rest può chiamare postgres? (no, ma plenora app sì)'
  - id: 'INF-005'
    status: 'TODO'
    title: '`/health` process-only sempre 200'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'infra'
          - 'health'
    references:
          - 'app/main.py'
    steps: '`GET /health` con DB stoppato, redis stoppato'
    assertion: '200 con body `{"status": "ok"}`; nessuna check di dipendenza esterna; tempo risposta < 50ms'
  - id: 'INF-006'
    status: 'TODO'
    title: '`/ready` 8 check distinti, fail-OPEN vs fail-CLOSED'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'infra'
          - 'health'
    references:
          - 'app/main.py'
    steps: '`GET /ready` in stato healthy, poi con DB down, poi con redis down'
    assertion: 'response include 8 check `{db, redis, celery_broker, celery_workers, object_storage, scheduler_beat, migrations, encryption_key}`; check critici (db, migrations) fail-CLOSED → 503; check non-critici (redis, scheduler_beat) fail-OPEN → 200 con `warnings`'
  - id: 'INF-007'
    status: 'TODO'
    title: '`/ready` DB down → 503'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'infra'
          - 'health'
    references:
          - 'INF-006'
    steps: 'stop postgres; `GET /ready`'
    assertion: '503 con `checks.db = {ok: false, error: ...}`; altri check riportati anche se non critici'
  - id: 'INF-008'
    status: 'TODO'
    title: '`/ready` migrations check (alembic head)'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'infra'
          - 'health'
          - 'migration'
    references:
          - 'INF-006'
    steps: 'rollback `alembic downgrade -1`; `GET /ready`'
    assertion: '503 con `checks.migrations = {ok: false, current: <rev-1>, expected: <head>}`'
  - id: 'INF-009'
    status: 'TODO'
    title: '`/ready` redis down → 200 con warning (fail-OPEN)'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'infra'
          - 'redis'
          - 'health'
    references:
          - 'INF-006'
    steps: 'stop redis; `GET /ready`'
    assertion: '200; `checks.redis = {ok: false}`; `warnings` array non vuoto include `redis`; app risponde su altri endpoint con fallback in-memory'
  - id: 'INF-010'
    status: 'TODO'
    title: '`/ready` celery_workers down → 200 con warning'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'infra'
          - 'celery'
          - 'health'
    references:
          - 'INF-006'
    steps: 'stop tutti i celery worker; `GET /ready`'
    assertion: '200 con `checks.celery_workers = {ok: false, count: 0}`; warning emesso'
  - id: 'INF-011'
    status: 'TODO'
    title: '`/ready` scheduler_beat down → 200 con warning'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'infra'
          - 'scheduler'
          - 'health'
    references:
          - 'INF-006, BEAT-006'
    steps: 'stop beat; `GET /ready`'
    assertion: '200 con `checks.scheduler_beat = {ok: false}`; warning include `beat heartbeat stale`'
  - id: 'INF-012'
    status: 'TODO'
    title: '`/ready` object_storage down → 200 con warning'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'infra'
          - 'health'
    references:
          - 'INF-006'
    steps: 'stop minio; `GET /ready`'
    assertion: '200 con `checks.object_storage = {ok: false}`; warning emesso'
  - id: 'INF-013'
    status: 'TODO'
    title: '`/ready` encryption_key missing → 503 (fail-CLOSED critico)'
    granularity: 'smoke'
    priority: 'must'
    tags:
          - 'infra'
          - 'health'
    references:
          - 'INF-006'
    steps: 'avvio app senza `PLENORA_ENCRYPTION_KEY` o invalida; `GET /ready`'
    assertion: '503 con `checks.encryption_key = {ok: false}`; app boot rifiutato o ready negato'
  - id: 'INF-014'
    status: 'TODO'
    title: 'Bootstrap order: import `from app.core.*` segue `_bootstrap()`'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'infra'
    references:
          - 'app/main.py:_bootstrap'
          - 'app/core/__init__.py'
    steps: 'ispezionare ordine import in `app/main.py` con AST; verifica che chiamata `_bootstrap()` precede ogni `from app.core.* import ...` non lazy'
    assertion: 'AST analysis conferma `_bootstrap()` è invocato prima dell''import di moduli core; runtime: log al boot mostra `bootstrap_complete` precede log `core_module_loaded`'
  - id: 'INF-015'
    status: 'TODO'
    title: 'Lifespan teardown chiude PG pool (idempotente multi-run)'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'infra'
          - 'idempotency'
    references:
          - 'app/main.py'
    steps: '1) avvio app, conta connessioni in `pg_stat_activity` 2) shutdown graceful (SIGTERM) 3) ripeti boot+shutdown 3 volte'
    assertion: 'dopo ogni shutdown, connessioni del pool plenora=0; nessun warning `pool not closed`; teardown idempotente (secondo close non solleva)'
