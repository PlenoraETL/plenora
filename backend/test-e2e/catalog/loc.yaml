area: 'loc'
description: 'Locale / timezone'
tests:
  - id: 'LOC-001'
    status: 'TODO'
    title: 'Timestamp tz-aware vs naive: handling documentato'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'locale'
    prereq:
          tests:
                  - 'EXT-001'
    dataset: 'rows con `created_at` `2024-01-01T00:00:00+02:00` e `2024-01-01T00:00:00`'
    assertion: 'tz-aware preservato con offset; naive convertito a UTC con flag `was_naive=true` o errore esplicito'
  - id: 'LOC-002'
    status: 'TODO'
    title: 'Decimal con separator "," (locale IT) in CSV → parser configurabile'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'locale'
          - 'csv'
    prereq:
          tests:
                  - 'EXT-011'
    dataset: 'CSV con `1.234,56` (IT) e `1,234.56` (US)'
    assertion: 'opzione `decimal_separator` rispettata; parsed value = 1234.56 in entrambi i casi'
  - id: 'LOC-003'
    status: 'TODO'
    title: 'Encoding cliente Windows-1252 → conversione lossless o errore esplicito'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'locale'
    prereq:
          tests:
                  - 'EXT-010'
    dataset: 'CSV con caratteri `€ è à ò` in cp1252'
    assertion: 'con `encoding=cp1252` parsing OK; con default UTF-8 errore `error_code=invalid_encoding` con byte offset'
  - id: 'LOC-004'
    status: 'TODO'
    title: 'Date format MM/DD/YYYY (US) vs DD/MM/YYYY (EU) → parser configurabile'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'locale'
    prereq:
          tests:
                  - 'EXT-010'
    dataset: 'CSV con `01/02/2024`'
    assertion: 'con `date_format=DD/MM/YYYY` parsed = 1 feb 2024; con `MM/DD/YYYY` = 2 jan 2024'
  - id: 'LOC-005'
    status: 'TODO'
    title: 'DST switch durante run notturno → idempotenza preservata'
    granularity: 'smoke'
    priority: 'optional'
    tags:
          - 'locale'
          - 'idempotency'
    prereq:
          tests:
                  - 'SCH-001'
    steps: 'schedule cron `30 2 * * *` la notte cambio ora (es. 26 ottobre)'
    assertion: 'run scattato 1 volta (non 0, non 2); `next_run_at` calcolato in UTC; log indica `dst_transition_handled`'
