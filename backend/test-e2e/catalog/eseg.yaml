area: 'eseg'
description: 'Eseguibili kiosk'
tests:
  - id: 'ESEG-001'
    status: 'TODO'
    title: 'Kiosk analyze-upload + parse metadata'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'eseguibili'
    references:
          - 'app/core/eseguibili/router.py:304'
    steps: '`POST /eseguibili/kiosk/analyze-upload` con file binario + form metadata'
    assertion: '200 con `{file_id, parsed_metadata: {size, mime, extension, sha256, ...}}`; file_id univoco; metadata persisted su filesystem (no in-memory)'
  - id: 'ESEG-002'
    status: 'TODO'
    title: 'Execute con file_id cross-user → 403'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'eseguibili'
    references:
          - 'app/core/eseguibili/router.py:339-362'
    steps: '1) user A `analyze-upload` → file_id F 2) user B `POST /eseguibili/kiosk/execute` con `file_id=F`'
    assertion: '403 con `error_code=file_owner_mismatch`; user B non può accedere file di A'
  - id: 'ESEG-003'
    status: 'TODO'
    title: 'Upload metadata multi-worker safe (filesystem, no in-memory)'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'eseguibili'
          - 'celery'
    references:
          - 'app/core/eseguibili/router.py:304'
    steps: '1) worker A serve `analyze-upload` (file_id F) 2) worker B serve `execute` (file_id F dello stesso user)'
    assertion: 'worker B trova metadata di F nonostante upload sia avvenuto su worker A; metadata storage su filesystem condiviso (es. `DATA_DIR/eseguibili_uploads/<file_id>.json`), no dict in-memory; entrambi worker leggono stesso file'
  - id: 'ESEG-004'
    status: 'TODO'
    title: 'Download authz: solo task_owner accede al risultato'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'eseguibili'
    references:
          - 'app/core/eseguibili/router.py:409'
    steps: '1) user A esegue eseguibile → result task_id T 2) user B `GET /eseguibili/kiosk/download/{T}`'
    assertion: 'user B → 403 (o 404 tenant-blind); user A → 200 con file binario; audit_log entry per tentativo B `denied`'
  - id: 'ESEG-005'
    status: 'TODO'
    title: 'Cleanup output post-send (single-shot)'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'eseguibili'
          - 'cleanup'
    references:
          - 'app/core/eseguibili/router.py:482'
    steps: '1) user A download result task_id T (200) 2) user A re-download stesso T'
    assertion: 'prima 200; seconda 404 con `error_code=output_already_consumed`; file fisicamente rimosso dal filesystem dopo prima consegna (single-shot)'
  - id: 'ESEG-006'
    status: 'TODO'
    title: 'Beat sweep orfani 2h'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'eseguibili'
          - 'scheduler'
    references:
          - 'workers/beat_scheduler.py:646'
    steps: '1) `analyze-upload` ma mai `execute` 2) attendi >2h (o mtime simulato) 3) trigger beat'
    assertion: 'file orfano + metadata rimossi; log `eseguibili_orphan_sweep removed=1 ttl_hours=2`'
  - id: 'ESEG-007'
    status: 'TODO'
    title: '`validate_no_executable` MIME-block-only: polyglot zip permesso (gap noto)'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'eseguibili'
          - 'rbac'
    references:
          - 'app/core/eseguibili/router.py:339-362'
    steps: '1) crea polyglot file (zip valido che è anche eseguibile valido, MIME `application/zip`) 2) upload via `analyze-upload`'
    assertion: 'validatore controlla SOLO MIME (allowlist non-executable); polyglot zip passa il check anche se contiene magic-byte exe; **comportamento corrente documentato come gap**: response 200, file accettato; test funge da regression-marker; risoluzione futura: aggiungere magic-byte sniff oltre MIME'
