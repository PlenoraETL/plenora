area: 'intm'
description: 'Intermediate cache layer'
tests:
  - id: 'INTM-001'
    status: 'TODO'
    title: 'Compare L2 branch `full_pg`'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'cache'
    references:
          - 'app/core/intermediate/router.py:347-595'
    steps: '`POST /intermediate/compare` con `mode=full_pg`, due run_id snapshot completo Postgres'
    assertion: '200 con `{equal: bool, diff_summary: {...}, hash_a, hash_b}`; usa branch `full_pg` (storage diff via SQL EXCEPT/INTERSECT); response include row counts'
  - id: 'INTM-002'
    status: 'TODO'
    title: 'Compare L2 branch `preview_only`'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'cache'
    references:
          - 'app/core/intermediate/router.py:347-595'
    steps: '`POST /intermediate/compare` con `mode=preview_only`'
    assertion: '200; diff calcolato sui soli preview rows (1000 righe max); response include `preview_size` e flag `is_partial=true`'
  - id: 'INTM-003'
    status: 'TODO'
    title: 'Compare L2 branch `metadata_only` → 422'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'cache'
    references:
          - 'app/core/intermediate/router.py:347-595'
    steps: '`POST /intermediate/compare` con `mode=metadata_only`'
    assertion: '422 con `error_code=metadata_only_compare_unsupported`; messaggio indica modi validi; **NON** è 501 (è scelta semantica: input rifiutato)'
  - id: 'INTM-004'
    status: 'TODO'
    title: 'Compare L2 branch `full_artifact` → 501'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'cache'
    references:
          - 'app/core/intermediate/router.py:347-595'
    steps: '`POST /intermediate/compare` con `mode=full_artifact`'
    assertion: '501 con `error_code=full_artifact_compare_not_implemented`; **NON** è 422 (è feature non ancora disponibile)'
  - id: 'INTM-005'
    status: 'TODO'
    title: 'Compare L2 mismatch → 422'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'cache'
    references:
          - 'app/core/intermediate/router.py:347-595'
    steps: '`POST /intermediate/compare` con due snapshot di tipologia diversa (es. uno full_pg, uno preview)'
    assertion: '422 con `error_code=intermediate_mode_mismatch`; messaggio indica i due mode incompatibili'
  - id: 'INTM-006'
    status: 'TODO'
    title: 'Pin/unpin retention FIFO'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'cache'
          - 'retention'
    references:
          - 'app/core/intermediate/router.py:35-51'
    steps: '1) crea N+1 snapshot (N = retention cap) 2) pin il primo 3) crea altri snapshot'
    assertion: 'snapshot pinnato preservato; non-pinnati sotto cap rimossi in ordine FIFO (oldest first); unpinning + nuovo snapshot → entra in coda eviction normalmente'
  - id: 'INTM-007'
    status: 'TODO'
    title: 'Node data NaN/Inf → null sanitization (response only, hash invariato)'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'cache'
    references:
          - 'app/core/intermediate/router.py:598'
    steps: '1) snapshot con valori NaN/Inf in colonna numerica 2) `GET /intermediate/{id}/preview`'
    assertion: 'response JSON valido con `null` al posto di NaN/Inf; hash dello snapshot computato sui valori originali (non sanitized) → hash invariato pre/post sanitize; log `sanitized_non_finite_values count=N`'
  - id: 'INTM-008'
    status: 'TODO'
    title: '`intermediate_mode` query param 4-literal Pydantic, 422 invalido'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'cache'
    references:
          - 'app/core/orchestrator/router.py:216-249'
    steps: '1) `POST /runs?intermediate_mode=full_pg` (valido) 2) `?intermediate_mode=invalid_xyz`'
    assertion: 'caso 1: 202; caso 2: 422 con detail Pydantic literal (4 valori ammessi: `full_pg|preview_only|metadata_only|full_artifact`)'
  - id: 'INTM-009'
    status: 'TODO'
    title: '`intermediate_mode` 403 non-superadmin'
    granularity: 'smoke'
    priority: 'nice'
    tags:
          - 'cache'
          - 'rbac'
    references:
          - 'app/core/orchestrator/router.py:216-249'
    steps: 'utente non-superadmin `POST /runs?intermediate_mode=preview_only`'
    assertion: '403 con `error_code=intermediate_mode_override_requires_superadmin`; per superadmin stesso payload → 202'
  - id: 'INTM-010'
    status: 'TODO'
    title: '`intermediate_mode` override per-call della global setting'
    granularity: 'integration'
    priority: 'nice'
    tags:
          - 'cache'
    references:
          - 'app/core/arricchisci/router.py:788'
          - 'app/core/orchestrator/router.py:216-249'
    steps: '1) `INTERMEDIATE_MODE_DEFAULT=metadata_only` (global) 2) superadmin `POST /runs?intermediate_mode=full_pg` 3) verifica run snapshot'
    assertion: 'snapshot creato in mode `full_pg` (override); global setting invariato; senza query param run usa `metadata_only`'
