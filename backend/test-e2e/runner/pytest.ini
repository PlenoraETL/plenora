[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
markers =
    profile_core: requires docker compose profile "core" (postgres + redis + fake-rest)
    profile_db: requires profile "db" (mysql + sqlserver in addition to core)
    profile_db_heavy: requires profile "db-heavy" (oracle in addition to db)
    profile_cloud: requires profile "cloud" (minio + azurite + localstack)
    profile_files: requires profile "files" (ftp + sftp)
    profile_full: requires profile "full" (everything)
    requires_app: requires plenora app (FastAPI backend) running
    smoke: smoke test (fast, no app dependency)
    slow: slow test (skipped by default unless --run-slow)
    interactive: interactive test (needs human verification)
    contract: contract test (validate response schema, run before any other suite)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
