[package]
name = "plenora-xlsx-exporter"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = "0.4"
csv = "1.4"
rust_xlsxwriter = { version = "=0.96.0", features = ["chrono", "constant_memory", "zmij"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
