# Default non-secret provider profile for optional integration tests.
# Keep enabled=false in the shared file: disabled providers are skipped.
# Set enabled=true only in provider_config.local.toml when the provider is
# expected to be reachable; enabled-but-unreachable providers must fail.
# Passwords stay in environment variables named by password_env.

[mysql]
# Override enabled=true locally to require this provider in test runs.
enabled = false
host = "127.0.0.1"
port = 3306
database = "dataflow_test"
username = "dataflow"
password_env = "PLENORA_TEST_MYSQL_PASSWORD"

[mariadb]
# Override enabled=true locally to require this provider in test runs.
enabled = false
host = "127.0.0.1"
port = 3307
database = "dataflow_test"
username = "dataflow"
password_env = "PLENORA_TEST_MARIADB_PASSWORD"

[oracle]
# Override enabled=true locally to require this provider in test runs.
enabled = false
host = "127.0.0.1"
port = 1521
database = "FREEPDB1"
service = "FREEPDB1"
username = "dataflow"
password_env = "PLENORA_TEST_ORACLE_PASSWORD"

[sqlserver]
# Override enabled=true locally to require this provider in test runs.
enabled = false
host = "127.0.0.1"
port = 1433
database = "dataflow_test"
schema = "dbo"
username = "sa"
password_env = "PLENORA_TEST_SQLSERVER_PASSWORD"
driver = "ODBC Driver 18 for SQL Server"
fallback_driver = "ODBC Driver 17 for SQL Server"
