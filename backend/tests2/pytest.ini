[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

pythonpath = C:\Users\Marco\Desktop\int_efm\PLENORA-ETL\backend

addopts = -q --tb=short

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

markers =
    unit: Test unitari
    functional: Test funzionali con processi veri o fake services
    security: Invarianti di sicurezza
    contract: Contratti pubblici
    regression: Regressioni da bug storici
    scheduler: Test scheduler
    arricchisci: Test arricchisci
    carica: Test carica
    features: Test features
    manipola: Test manipola
    orchestrator: Test orchestrator
    intermediate: Test intermediate
    eseguibili: Test eseguibili
    estrai: Test estrai
    shared: Test su moduli condivisi / cross-module
    integration: Integration test (Redis fake, DB fixture, no Docker)
