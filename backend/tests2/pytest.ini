[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pythonpath: relativo a questo file (tests2/pytest.ini → ../ = backend/).
# Sostituisce il path assoluto stale "PLENORA-ETL" (rebrand → URBY-ETL).
# conftest.py:8-15 fa gia' sys.path.insert(parent.parent), questa entry e'
# difesa-in-profondita' per pytest invocato con --noconftest o ordering custom.
pythonpath = ..

addopts = -q --tb=short

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

markers =
    unit: Test unitari
    functional: Test funzionali con processi veri o fake services
    security: Invarianti di sicurezza
    contract: Contratti pubblici
    regression: Regressioni da bug storici
    architecture: Guardie architetturali, import boundary, facade/strangler, allowlist
    docs_guard: Guardie su documentazione, runbook e report audit non runtime
    cleanroom_excluded: Test esclusi dal gate cleanroom/default per dipendenze doc/audit storiche
    slow: Test validi ma non adatti al gate PR rapido
    cleanroom: Guardie pytest per script/docs di cleanroom acceptance
    scheduler: Test scheduler
    arricchisci: Test arricchisci
    carica: Test carica
    features: Test features
    manipola: Test manipola
    orchestrator: Test orchestrator
    projects: Test projects
    intermediate: Test intermediate
    eseguibili: Test eseguibili
    estrai: Test estrai
    shared: Test su moduli condivisi / cross-module
    imdf: Test IMDF
    observability: Test health/readiness/metrics/logging osservabilita'
    perf_correctness: Test di correttezza per operazioni incluse nelle misure performance
    perf_bench: Benchmark/performance smoke non destinati al gate PR principale
    perf_baseline: Baseline performance storiche/comparative non destinate al gate PR principale
    integration: Integration test (Redis fake, DB fixture, no Docker)
    real_pg: Richiede un PostgreSQL VERO (PLENORA_REAL_PG_DSN); lanciatore unico backend/scripts/run_real_pg_tests.py; saltato in CI (nessun PostgreSQL), limite dichiarato in tests2/shared/_real_pg.py
    install_validation: Mandatory install-validation lane; required local/backend stack failures must fail clearly, not skip silently
    optional_provider: Optional external provider lane; tests may skip clearly when provider env, credentials, driver, or service is unavailable
    developer_nightly: Developer/nightly integration lane; valid but too heavy or specialized for install validation
    requires_postgres: Requires PostgreSQL/database access
    requires_redis: Requires Redis/Celery broker or result backend
    requires_celery: Requires a real Celery worker
    db_live_opt_in: DB-live developer/nightly tests guarded by explicit env opt-in; not counted as mandatory install validation
    requires_arcgis: Requires ArcGIS Online or ArcGIS service credentials/network
    requires_oracle: Requires Oracle provider service/driver
    requires_mssql: Requires Microsoft SQL Server provider service/driver
    requires_mysql: Requires MySQL provider service/driver
    requires_mariadb: Requires MariaDB provider service/driver
    requires_external_network: Requires external network access beyond local test services
    requires_backend_http_service: test che richiede un backend HTTP
        live/uvicorn via fixture backend_server o integration_backend_server.
        Escluso dalla CI principale push/PR; destinato a workflow
        functional/manual/nightly tier (Binario B-2 follow-up).
