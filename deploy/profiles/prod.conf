# =============================================================================
# Plenora-ETL deploy profile: prod
# =============================================================================
# Public deploy config. NESSUN SECRET in questo file.
#
# I secret restano fuori dal repo:
#   - PEM SSH:  env PLENORA_DEPLOY_PEM (per-operatore)
#   - AWS:      IAM role attached all'EC2 / SSM Parameter Store
#   - .env:     /home/ubuntu/plenora-etl/backend/.env (per-installazione, sul server)
#
# Selezione profilo:
#   bash deploy.sh                              # default = prod
#   PLENORA_DEPLOY_PROFILE=prod bash deploy.sh
#   bash deploy.sh --profile=prod
# =============================================================================

# --- Target server ---------------------------------------------------------
SERVER="ubuntu@15.160.219.93"

# --- Path remoti -----------------------------------------------------------
REMOTE_BACKEND_PATH="/home/ubuntu/plenora-etl/backend"
REMOTE_FRONTEND_PATH="/home/ubuntu/plenora-etl/frontend"

# --- Health / readiness URLs ----------------------------------------------
# Endpoint applicativi raggiungibili dal server target via curl localhost.
# Il polling /ready avviene SSH-side, quindi 127.0.0.1 e' corretto.
APP_HEALTH_URL="http://127.0.0.1:5004/health"
APP_READY_URL="http://127.0.0.1:5004/ready"
APP_BASE_URL="https://lab.plenora.it"
BACKEND_PORT="5004"

# --- Systemd units da gestire ---------------------------------------------
# Lista space-separated. Restart e' applicato a tutti, is-active controllato
# su tutti.
SYSTEMD_UNITS="plenora-backend plenora-worker plenora-beat"

# --- Branch guard ----------------------------------------------------------
# Allowlist branch da cui e' permesso il deploy verso questo profilo.
# Per profili production-tier, di norma solo `main`.
ALLOWED_BRANCHES="main"

# --- Health gate timing ----------------------------------------------------
# Polling /ready post-restart. Aumentare se cold-start uvicorn o migration
# DB richiedono piu' tempo.
READY_TIMEOUT_SEC="60"
READY_POLL_INTERVAL_SEC="2"

# --- Frontend retention (usato da batch 2 P4, presente per completezza) ----
RETAIN_FRONTEND_VERSIONS="3"
