# Swagger Petstore - OpenAPI 3.0 (estratto fedele di petstore3.swagger.io)
openapi: 3.0.4
info:
  title: Swagger Petstore - OpenAPI 3.0
  version: 1.0.27
servers:
  - url: /api/v3
paths:
  /pet:
    put:
      summary: Update an existing pet.
      operationId: updatePet
      requestBody:
        $ref: '#/components/requestBodies/Pet'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
            application/xml:
              schema:
                $ref: '#/components/schemas/Pet'
      security:
        - petstore_auth: [write:pets, read:pets]
  /pet/findByTags:
    get:
      summary: Finds Pets by tags.
      operationId: findPetsByTags
      parameters:
        - name: tags
          in: query
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        default:
          description: Unexpected error
  /pet/{petId}:
    get:
      summary: Find pet by ID.
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          $ref: '#/components/responses/PetOk'
      security:
        - api_key: []
        - petstore_auth: [write:pets, read:pets]
    patch:
      summary: Partially update a pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              type: object
              properties:
                status:
                  type: string
      responses:
        '204':
          description: Updated
  /store/inventory:
    get:
      summary: Returns pet inventories by status.
      operationId: getInventory
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
      security:
        - api_key: []
components:
  schemas:
    Category:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
    Tag:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
    Pet:
      required: [name, photoUrls]
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          items: {type: string}
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          enum: [available, pending, sold]
  requestBodies:
    Pet:
      description: Pet object that needs to be added to the store
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Pet'
  responses:
    PetOk:
      description: successful operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Pet'
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://petstore3.swagger.io/oauth/authorize
          scopes:
            write:pets: modify pets in your account
            read:pets: read your pets
    api_key:
      type: apiKey
      name: api_key
      in: header
