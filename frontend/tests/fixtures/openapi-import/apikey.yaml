openapi: 3.0.0
info:
  title: Geocoder con API key
  version: '1.0'
servers:
  - url: https://geo.example.com/v1
security:
  - QueryKey: []
paths:
  /geocode:
    get:
      summary: Geocodifica un indirizzo
      parameters:
        - name: address
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        location:
                          type: object
                          properties:
                            id: {type: string}
                            lat: {type: number}
                            lng: {type: number}
                        address:
                          type: object
                          properties:
                            id: {type: string}
                            city: {type: string}
  /reverse:
    get:
      summary: Geocodifica inversa
      security:
        - HeaderKey: []
      parameters:
        - name: lat
          in: query
          schema: {type: number}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  city: {type: string}
components:
  securitySchemes:
    CookieKey:
      type: apiKey
      in: cookie
      name: SESSIONID
    HeaderKey:
      type: apiKey
      in: header
      name: X-Geo-Key
    QueryKey:
      type: apiKey
      in: query
      name: key
