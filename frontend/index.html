<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plenora</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!--
    ANTI-FLASH: applica il tema PRIMA che React monti.
    Questo script inline è intenzionalmente sincrono (no defer/async)
    per evitare il flash del tema sbagliato al primo render.
  -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('plenora-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.backgroundColor = t === 'light' ? '#EFF2F9' : '#07090F';
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>
</html>
