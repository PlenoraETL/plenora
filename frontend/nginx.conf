server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Intestazioni di sicurezza (CSP compresa): file generato dal backend
    # (app/core/security/frontend_headers.py), mai scritte qui. nginx NON
    # eredita gli add_header del server in una location che ne dichiara di
    # suoi: ogni location con add_header include di nuovo il file.
    include /etc/nginx/plenora-security-headers.conf;

    location = /health {
        access_log off;
        include /etc/nginx/plenora-security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        include /etc/nginx/plenora-security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    # Same-origin API proxy: evita di compilare localhost/127.0.0.1 nel bundle,
    # che dal browser remoto indicherebbe il computer dell'utente.
    location /api/ {
        proxy_pass http://backend:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /ready {
        proxy_pass http://backend:5004/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html sempre riconvalidato: dopo un deploy deve puntare ai nuovi
    # asset. `expires` (non add_header) mantiene gli header di sicurezza.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
