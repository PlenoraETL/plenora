name: CI — Functional (HTTP-live)

# Phase 1 / B-2 — Workflow tier separato per i test marcati
# `requires_backend_http_service`. Sono i 38 test (al baseline post-PR #12)
# che spawnano un backend HTTP reale (uvicorn `app.main:app`) tramite
# fixture `backend_server` / `integration_backend_server` /
# `integration_fake_api_server`. Questi test NON girano nella CI
# principale push/PR (deselezionati via `-m "not
# requires_backend_http_service"` in `.github/workflows/ci.yml`) perche'
# richiedono un Postgres reale che il runner CI principale non fornisce.
#
# Stato iniziale (Step 1 scaffold):
#   - trigger SOLO `workflow_dispatch` (manual, opt-in)
#   - niente cron nightly finche' il workflow non e' stabile
#   - `continue-on-error: true` sul job per non bloccare nulla in fase
#     diagnostica
#   - NON aggiungere come "required check" su branch protection finche'
#     non e' stabile (3-4 run consecutivi verdi)
#
# Promozione successiva (B-2 follow-up, NON in questo scaffold):
#   - aggiungere `schedule: cron "0 2 * * *"` (nightly UTC)
#   - rimuovere `continue-on-error`
#   - eventualmente promuovere a required check

on:
  workflow_dispatch:
    inputs:
      pytest_extra_args:
        description: "Extra args passati a pytest (es. -k test_name, -x, ecc.)"
        required: false
        default: ""

# Annulla run precedenti se ne arriva uno nuovo sullo stesso ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional:
    name: Backend HTTP-live tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fase diagnostica: il fail del job non blocca nulla. Rimuovere
    # quando il workflow e' stabile.
    continue-on-error: true

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: plenora_test
          POSTGRES_PASSWORD: plenora_test
          POSTGRES_DB: plenora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plenora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: development
      # Storage policy DB (no S3 reale richiesto per la maggior parte
      # dei flow). I test che richiedono S3 sono coperti dal moto v5
      # mock in requirements-dev.
      STORAGE_POLICY: db
      # DATABASE_URL reale al Postgres del service. A differenza della
      # CI principale (dove DATABASE_URL e' un dummy non-raggiungibile
      # per consentire l'import-time check senza connect reale), qui
      # serve un PG vivo perche' uvicorn `app.main:app` chiama
      # `init_all_dbs()` a startup (vedi backend/app/main.py:50-51).
      DATABASE_URL: postgresql://plenora_test:plenora_test@127.0.0.1:5432/plenora_test
      # JWT secret coerente con il default usato dalle fixture
      # functional/integration (vedi tests2/{functional,integration}
      # /conftest.py).
      JWT_SECRET_KEY: tests2-functional-jwt-secret
      # Celery broker/backend al Redis del service.
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      # Opt-in SSRF loopback: i test functional spawnano un fake HTTP
      # server su 127.0.0.1 e poi fanno chiamare il backend reale verso
      # quell'URL. Senza opt-in, validate_external_url blocca il loopback
      # come SSRF (corretto in prod, falso positivo qui).
      PLENORA_ALLOW_LOOPBACK_OUTBOUND: "1"
      # Backup bucket dummy (stesso pattern di PR #5).
      BACKUP_BUCKET: test-backup-bucket-no-real-s3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Generate ephemeral PLENORA_ENCRYPTION_KEY
        # Encryption-at-rest richiesto da app/shared/crypto.py per le
        # credenziali PG-stored. Generato al volo perche' non e'
        # necessario persisterlo fra run (nessun dato cifrato vive
        # oltre il run del test).
        run: |
          echo "PLENORA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Ensure 'plenora' schema exists in test DB
        # Diagnosi run #25115729294 (PR #14 diagnostic patch): uvicorn
        # `app.main:app` chiama init_all_dbs() -> apply_pending_migrations()
        # che esegue `CREATE TABLE IF NOT EXISTS plenora.schema_migrations`.
        # Postgres non auto-crea schemi: senza un `CREATE SCHEMA plenora`
        # preventivo, la query fallisce con
        # `psycopg2.errors.InvalidSchemaName: schema "plenora" does not exist`
        # e uvicorn esce con exit code 1, facendo fallire il setup di
        # tutti i 38 test HTTP-live.
        #
        # Workflow-only fix (B-2 ephemeral test DB): pre-creiamo lo schema
        # vuoto prima del pytest. In produzione lo schema viene
        # provisionato dal deploy script o esiste gia' sul DB managed.
        # Niente patch a app/db/* finche' non serve un fix prod-side.
        #
        # `psql` e' preinstallato sui runner ubuntu-latest (parte di
        # postgresql-client-16). Fallback apt-install se mai mancasse.
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -yqq postgresql-client
          fi
          psql "$DATABASE_URL" -c 'CREATE SCHEMA IF NOT EXISTS plenora;'

      - name: Ensure 'dataflow' user + 'dataflow_test' DB for postgres_ext tests
        # Helper backend/tests2/integration/harness/postgres_ext.py si
        # aspetta un secondo PG database `dataflow_test` con user
        # `dataflow` per simulare un PG cliente esterno (separato da
        # plenora_test che ospita lo schema applicativo). Il PG service
        # del workflow espone una sola istanza, quindi creiamo user+DB
        # aggiuntivi via psql usando plenora_test come SUPERUSER (default
        # del docker-entrypoint POSTGRES_USER).
        #
        # Idempotente: re-run safe via DO block (CREATE USER) e check
        # pg_database (CREATE DATABASE non e' ammesso in DO block).
        #
        # ALTER SCHEMA public OWNER TO dataflow: PG 15+ ha REVOKE CREATE
        # ON SCHEMA public FROM PUBLIC di default. Per consentire al
        # helper postgres_ext.py di fare `CREATE TABLE public.<name>` con
        # user dataflow, ALTER OWNER e' robusto (copre CREATE/USAGE/DROP).
        # GRANT ALL aggiuntivo per safety net.
        #
        # `set -e` interrompe lo step su qualunque psql error fuori
        # dalla pipe `||`. ON_ERROR_STOP=1 aborta SQL multi-statement
        # al primo errore. `psql` e' gia' installato dal step precedente.
        env:
          PGPASSWORD: plenora_test
        run: |
          set -e

          # 1. CREATE USER 'dataflow' (idempotente via DO + pg_roles)
          psql -h 127.0.0.1 -U plenora_test -d plenora_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'dataflow') THEN
              CREATE USER "dataflow" WITH PASSWORD 'dataflow_test_2026';
            END IF;
          END $$;
          SQL

          # 2. CREATE DATABASE 'dataflow_test' (idempotente via grep su pg_database)
          # CREATE DATABASE non e' ammesso in DO block / transaction (limitazione PG).
          psql -h 127.0.0.1 -U plenora_test -d plenora_test -tAc \
            "SELECT 1 FROM pg_database WHERE datname = 'dataflow_test'" \
            | grep -q 1 || \
            psql -h 127.0.0.1 -U plenora_test -d plenora_test -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE dataflow_test OWNER dataflow;"

          # 3. Schema public ownership + grant (PG 15+ default REVOKE).
          # ALTER OWNER e' robusto: dataflow puo' CREATE TABLE public.X come
          # fa il helper postgres_ext.py:49.
          psql -h 127.0.0.1 -U plenora_test -d dataflow_test -v ON_ERROR_STOP=1 -c \
            "ALTER SCHEMA public OWNER TO dataflow;"
          psql -h 127.0.0.1 -U plenora_test -d dataflow_test -v ON_ERROR_STOP=1 -c \
            "GRANT ALL ON SCHEMA public TO dataflow;"

      - name: Run pytest (HTTP-live tier)
        working-directory: backend
        # Marker positivo: gira SOLO i test che la CI principale ha
        # deselezionato. Extra args opzionali via input workflow_dispatch
        # per debug mirato (es. -k test_name, -x stop-on-first-fail).
        run: |
          pytest tests2/ -c tests2/pytest.ini \
            -m "requires_backend_http_service" \
            ${{ inputs.pytest_extra_args }}
