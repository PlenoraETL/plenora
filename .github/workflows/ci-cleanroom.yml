name: CI — Cleanroom Install Verifier

# BE-GO-READY-INSTALLATION-004 — clean install verifier.
#
# Goal: provare end-to-end che il backend si avvii su uno stack
# completamente vuoto (PostgreSQL fresh + Redis fresh + env minima),
# senza interventi manuali (niente `psql CREATE SCHEMA` pre-step:
# il runner deve creare lo schema da solo — vedi
# `app/db/migrations_runner.ensure_schema`, INSTALLATION-002).
#
# Scope intenzionalmente bounded:
#   - non installa Docker/compose;
#   - non monta storage S3 reale (`STORAGE_POLICY=db`);
#   - non esercita Celery worker / beat (solo backend HTTP);
#   - non sostituisce `ci.yml` o `ci-functional.yml`.
#
# Stato iniziale (diagnostic tier):
#   - trigger `workflow_dispatch` + `pull_request` filtrato sui path
#     che possono rompere il bootstrap (migrations, db layer, config,
#     requirements);
#   - `continue-on-error: true`: il fail non blocca i merge finche'
#     non e' stabile (3-4 run consecutivi verdi);
#   - non required check su branch protection.
#
# Promozione successiva (NON in questo scaffold):
#   - rimuovere `continue-on-error` dopo 3-4 run consecutivi verdi;
#   - aggiungere su tutti i `pull_request` (non solo path filter);
#   - valutare promozione a required check.

on:
  workflow_dispatch:
    inputs:
      ready_timeout_seconds:
        description: "Secondi massimi di polling /ready prima di fail"
        required: false
        default: "60"
  pull_request:
    branches: [main]
    paths:
      - "backend/app/db/**"
      - "backend/app/main.py"
      - "backend/app/config.py"
      - "backend/migrations/**"
      - "backend/requirements.txt"
      - ".github/workflows/ci-cleanroom.yml"

# Annulla run precedenti se ne arriva uno nuovo sullo stesso ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: il workflow legge il repo (checkout) e non scrive
# nulla. Niente issue/PR comment, niente release, niente push. Default
# GITHUB_TOKEN sarebbe read/write a seconda delle settings del repo;
# lo stringe esplicitamente a sola lettura per ridurre il blast radius
# se una dep installata via `pip install` venisse compromessa
# (supply-chain). Allineato alle best practice di GitHub Actions
# hardening.
permissions:
  contents: read

jobs:
  cleanroom:
    name: Backend boots from empty stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Diagnostic tier: il fail non blocca nulla. Rimuovere quando
    # il workflow e' stabile (vedi commenti in cima al file).
    continue-on-error: true

    services:
      # Postgres fresh: container effimero, nessuna seed, nessun
      # volume persistente. Lo schema applicativo NON viene creato
      # qui — deve farlo il runner del backend.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: plenora_clean
          POSTGRES_PASSWORD: plenora_clean
          POSTGRES_DB: plenora_clean
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plenora_clean"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Redis fresh: stessa logica, container effimero.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Env minima per un boot clean-install. Coerente con
      # `docs/ops/runtime-prereqs.md` "minimal env" e con la decisione
      # matrix di `BE_INSTALLATION_AUDIT.md` §3 (DEPLOY_INFRA + SECRET_INFRA).
      ENVIRONMENT: development
      DATABASE_URL: postgresql://plenora_clean:plenora_clean@127.0.0.1:5432/plenora_clean
      # DB_SCHEMA esplicitato per documentare il default e per esercitare
      # il path di `migrations_runner.ensure_schema(DB_SCHEMA)`.
      DB_SCHEMA: plenora
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      # Storage policy DB: niente S3/MinIO, niente bucket reale.
      STORAGE_POLICY: db
      # Bucket dummy: stesso pattern di ci.yml/ci-functional.yml.
      # `validate_storage_config()` richiede il valore non-vuoto anche
      # con policy=db perche' lo legge a startup; l'uso reale e' bypassato.
      BACKUP_BUCKET: cleanroom-no-real-s3
      # JWT/encryption ephemeral: generati al volo, non persistiti.
      # JWT_SECRET_KEY viene esportato a step (vedi sotto) per usare
      # un valore random per run.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend runtime dependencies
        # Nota: NON installa requirements-dev.txt. Il verifier deve
        # esercitare l'install set "prod-like" (no pytest/hypothesis/moto):
        # se un import a startup richiede una dep dev, e' un bug.
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate ephemeral secrets
        # PLENORA_ENCRYPTION_KEY + JWT_SECRET_KEY sono SECRET_INFRA per
        # ADR-0021. In cleanroom CI nessun dato cifrato sopravvive alla
        # run, quindi rotation per-run e' safe e desiderabile.
        run: |
          {
            echo "PLENORA_ENCRYPTION_KEY=$(openssl rand -base64 48)"
            echo "JWT_SECRET_KEY=$(openssl rand -base64 48)"
          } >> "$GITHUB_ENV"

      - name: Verify schema does NOT pre-exist
        # Pre-condition assertion: se qualche layer crea lo schema
        # prima del backend, il test perde il suo significato. Falliamo
        # esplicitamente se troviamo `plenora` gia' presente — sintomo
        # di una regressione (es. seed accidentale, container riusato,
        # workaround `psql CREATE SCHEMA` reintrodotto).
        env:
          PGPASSWORD: plenora_clean
        run: |
          set -e
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -yqq postgresql-client
          fi
          present=$(psql -h 127.0.0.1 -U plenora_clean -d plenora_clean -tAc \
            "SELECT 1 FROM information_schema.schemata WHERE schema_name = 'plenora'")
          if [ "$present" = "1" ]; then
            echo "::error::Schema 'plenora' gia' presente prima del boot. Cleanroom invariant violato."
            exit 1
          fi
          echo "OK: schema 'plenora' assente, runner deve crearlo."

      - name: Boot backend (uvicorn) in background
        # Avviamo il backend in background. Tutta la sequenza di
        # bootstrap (validate_startup -> validate_storage_config ->
        # init_all_dbs -> apply_pending_migrations -> ensure_schema +
        # CREATE TABLE schema_migrations + 18 migration .sql) gira qui.
        # Log redirezionato a file per diagnosi su failure.
        working-directory: backend
        run: |
          set -e
          mkdir -p .cleanroom-logs
          # nohup + & per detach. La PID la scriviamo cosi' la teardown
          # puo' killare il processo anche se /ready non risponde.
          nohup python -m uvicorn app.main:app \
            --host 127.0.0.1 --port 5004 --workers 1 \
            > .cleanroom-logs/uvicorn.log 2>&1 &
          echo $! > .cleanroom-logs/uvicorn.pid
          echo "uvicorn started (pid=$(cat .cleanroom-logs/uvicorn.pid))"

      - name: Poll /ready until backend is up
        # Polling con timeout. Verifica esplicitamente status code 200
        # e payload con postgres+redis ok (non solo "qualcosa ha risposto").
        # Su timeout: dump dei log uvicorn per diagnostica.
        working-directory: backend
        run: |
          set -e
          timeout="${{ inputs.ready_timeout_seconds || 60 }}"
          deadline=$((SECONDS + timeout))
          last_status=""
          last_body=""
          while [ $SECONDS -lt $deadline ]; do
            if response=$(curl -sS -m 3 -w "\n%{http_code}" http://127.0.0.1:5004/ready 2>/dev/null); then
              last_body=$(echo "$response" | head -n -1)
              last_status=$(echo "$response" | tail -n 1)
              if [ "$last_status" = "200" ]; then
                echo "/ready -> 200"
                echo "$last_body"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "::error::Backend non e' arrivato a /ready 200 entro ${timeout}s"
          echo "Ultimo status: ${last_status:-<no response>}"
          echo "Ultimo body: ${last_body:-<empty>}"
          echo "===== uvicorn log (tail 200) ====="
          tail -n 200 .cleanroom-logs/uvicorn.log || true
          exit 1

      - name: Verify schema autocreate happened
        # Post-condition: confermiamo che il bootstrap reale (non un
        # workaround) ha creato lo schema + la tabella di tracking.
        env:
          PGPASSWORD: plenora_clean
        run: |
          set -e
          schema_present=$(psql -h 127.0.0.1 -U plenora_clean -d plenora_clean -tAc \
            "SELECT 1 FROM information_schema.schemata WHERE schema_name = 'plenora'")
          if [ "$schema_present" != "1" ]; then
            echo "::error::Schema 'plenora' non esiste dopo /ready 200 — migrations_runner.ensure_schema non ha funzionato."
            exit 1
          fi
          tracking_present=$(psql -h 127.0.0.1 -U plenora_clean -d plenora_clean -tAc \
            "SELECT 1 FROM information_schema.tables WHERE table_schema = 'plenora' AND table_name = 'schema_migrations'")
          if [ "$tracking_present" != "1" ]; then
            echo "::error::plenora.schema_migrations non esiste — bootstrap incompleto."
            exit 1
          fi
          applied=$(psql -h 127.0.0.1 -U plenora_clean -d plenora_clean -tAc \
            "SELECT count(*) FROM plenora.schema_migrations")
          echo "OK: schema 'plenora' creato, ${applied} migration tracciate."

      - name: Verify Celery cleanroom readiness
        # BE-GO-READY-INSTALLATION-014-CELERY-CLEANROOM-READINESS.
        #
        # Bounded import + broker probe. Does NOT spawn a real
        # `celery worker` / `celery beat` (would require fragile
        # sleep loops to wait for ready and external services we
        # do not have). What we DO assert:
        #
        # 1. workers.celery_app imports cleanly under the cleanroom
        #    env (this exercises the same settings/dotenv loading
        #    path that a real worker would, AND the import-time
        #    `include=[...]` task module list - if any task module
        #    has an import-time bug it surfaces here).
        # 2. The Celery app `main` is the canonical "dataflow_tasks"
        #    (renaming would break worker discovery via the
        #    `celery -A workers.celery_app` CLI contract).
        # 3. All 5 expected task modules registered tasks.
        # 4. Broker connectivity via `connection().ensure_connection`
        #    with a 5s timeout and a single attempt - uses the
        #    existing redis:7-alpine service container, no extra
        #    infra. Sleep-free: kombu's ensure_connection blocks at
        #    most `timeout` seconds.
        # 5. PlenoraBeatScheduler resolves as a symbol (does NOT
        #    instantiate; constructor touches PG which is already
        #    covered by the /ready post-condition).
        working-directory: backend
        run: |
          set -e
          python - <<'PYEOF'
          import importlib
          import sys
          # 1 + 2: import the Celery app + verify the canonical main
          # name. The systemd unit (plenora-celery.service) invokes
          # `celery -A workers.celery_app worker`; renaming either the
          # module path or the Celery `main` would break the CLI
          # contract silently.
          from workers.celery_app import celery_app
          assert celery_app.main == "dataflow_tasks", \
              f"Celery main name regressed: got {celery_app.main!r}, expected 'dataflow_tasks'"
          # 3: every module in `include=[...]` must import cleanly.
          # This is the strict catch for import-time bugs in any task
          # module - the kind that would crash the worker on startup
          # in production but would NOT be caught by app HTTP boot.
          expected_modules = (
              "workers.tasks.enrichment_task",
              "workers.tasks.carica_task",
              "workers.tasks.schedule_task",
              "workers.tasks.pipeline_task",
              "workers.tasks.imdf_publish_task",
              "workers.tasks.cleanroom_task",
              "workers.tasks.cleanroom_beat_task",
          )
          import_failures = []
          for mod in expected_modules:
              try:
                  importlib.import_module(mod)
              except Exception as exc:
                  import_failures.append((mod, type(exc).__name__, str(exc)))
          if import_failures:
              print("::error::Celery include module(s) failed to import:")
              for mod, etype, emsg in import_failures:
                  print(f"  {mod}: {etype}: {emsg}")
              sys.exit(1)
          # After the explicit imports above, the Celery task registry
          # must hold the app tasks alongside the celery.* built-ins.
          # Built-ins are typically ~10 entries; we assert strictly
          # MORE than that, which proves at least one app-side task
          # registered (i.e. the @app.task decorators ran).
          registered = list(celery_app.tasks.keys())
          builtin_count = sum(1 for t in registered if t.startswith("celery."))
          app_count = len(registered) - builtin_count
          if app_count < 1:
              print(f"::error::Celery registry has only {builtin_count} built-in task(s) "
                    f"and 0 app tasks. Registered: {sorted(registered)}")
              sys.exit(1)
          print(f"OK: Celery app main='{celery_app.main}', "
                f"{len(expected_modules)} include module(s) imported, "
                f"{app_count} app task(s) + {builtin_count} built-in(s) registered.")
          # 4: broker connectivity (bounded, no sleep loop). kombu's
          # ensure_connection blocks for at most `timeout` seconds.
          conn = celery_app.connection()
          try:
              conn.ensure_connection(timeout=5, max_retries=1)
              print(f"OK: Celery broker reachable at {conn.as_uri(include_password=False)}")
          finally:
              conn.release()
          # 5: beat scheduler symbol resolves. We do NOT instantiate -
          # the constructor reads from PG (which is already covered by
          # the /ready post-condition in the previous step) and beat
          # leader-lock state in Redis. Symbol resolution alone catches
          # rename / deletion regressions that would break
          # plenora-beat.service ExecStart.
          from workers.beat_scheduler import PlenoraBeatScheduler
          assert PlenoraBeatScheduler.__name__ == "PlenoraBeatScheduler", \
              "PlenoraBeatScheduler class renamed; systemd unit and docs need to be updated."
          print("OK: PlenoraBeatScheduler symbol resolves.")
          PYEOF

      - name: Verify Celery worker enqueue smoke
        # BE-GO-READY-INSTALLATION-019-CELERY-WORKER-ENQUEUE-SMOKE-IMPL.
        #
        # Real worker enqueue/dequeue smoke. Spawns a `celery worker`
        # in `--pool=solo` mode (deterministic, no fork), enqueues
        # the pure no-op `cleanroom.ping` task, and waits for the
        # result with a hard 30s cap via `AsyncResult.get(timeout=N)`
        # against the existing Redis result backend. No fragile
        # shell sleep loops: the only `sleep` is in the trap-based
        # teardown after the smoke has already passed or failed,
        # which is bounded teardown not bounded readiness.
        #
        # The pure-no-op primitive lives at
        # backend/workers/tasks/cleanroom_task.py and is registered
        # via the canonical name `cleanroom.ping`. Contract is
        # locked by tests2/shared/test_celery_enqueue_smoke_design_guard.py.
        #
        # Failure modes:
        # - worker fails to start (import error, bootstrap fail) ->
        #   AsyncResult.get(timeout=30) raises TimeoutError; the
        #   worker.log artifact is uploaded for diagnosis;
        # - task does not return "pong" -> AssertionError in the
        #   probe;
        # - broker unreachable -> caught earlier by the readiness
        #   step.
        working-directory: backend
        run: |
          set -e
          mkdir -p .cleanroom-logs
          nohup celery -A workers.celery_app worker \
              --pool=solo --loglevel=info \
              -Q celery -n cleanroom@%h \
              > .cleanroom-logs/worker.log 2>&1 &
          worker_pid=$!
          echo "$worker_pid" > .cleanroom-logs/worker.pid
          echo "celery worker started (pid=${worker_pid})"
          # Trap-based teardown: send TERM, wait briefly, force KILL.
          # `sleep 2` here is bounded teardown (after the assertion
          # has run), not a readiness sleep loop.
          trap 'kill -TERM "$(cat .cleanroom-logs/worker.pid 2>/dev/null)" 2>/dev/null || true; sleep 2; kill -9 "$(cat .cleanroom-logs/worker.pid 2>/dev/null)" 2>/dev/null || true' EXIT
          python - <<'PYEOF'
          # Bounded smoke. AsyncResult.get(timeout=30) blocks at most
          # 30s by polling the Redis result backend; no shell sleep.
          # If the worker is slow to come online, get() retries
          # internally up to the timeout cap.
          from workers.celery_app import celery_app
          ar = celery_app.send_task("cleanroom.ping")
          result = ar.get(timeout=30)
          assert result == "pong", f"unexpected result: {result!r}"
          print(f"OK: cleanroom.ping enqueue/dequeue round-trip succeeded; result={result!r}")
          PYEOF

      - name: Upload worker log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cleanroom-celery-worker-log
          path: backend/.cleanroom-logs/worker.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Celery beat tick smoke
        # BE-GO-READY-INSTALLATION-021-CELERY-BEAT-TICK-SMOKE-IMPL.
        #
        # Real beat tick smoke. Spawns:
        #   - a `celery worker` (--pool=solo) to execute the
        #     beat-fired task;
        #   - a `celery beat -S workers.beat_scheduler.PlenoraBeatScheduler`
        #     with PLENORA_CLEANROOM_BEAT_PING=1 set so the env-gated
        #     5-second beat_schedule entry registers and the beat
        #     scheduler fires `cleanroom.beat_ping` every 5s.
        #
        # The 019 enqueue smoke killed its worker via trap on shell
        # exit, so this step starts a fresh worker. Both worker and
        # beat are torn down via trap (TERM, sleep 2, KILL) at the
        # end of this step's shell.
        #
        # Observation pattern: scan the Redis result backend for
        # `celery-task-meta-*` keys with status=SUCCESS and
        # result="beat_pong". Bounded deadline = 25s; beat fires
        # every 5s so the deadline allows ~5 fire windows. This is
        # NOT a fragile sleep loop: the deadline is hard-bounded,
        # the inner sleep is a courtesy poll-cadence (0.5s), and
        # the loop exits as soon as ONE matching key is observed.
        #
        # Failure modes:
        #   - beat fails to start (import error, bootstrap fail) ->
        #     no beat ticks, deadline expires; both logs uploaded
        #     for diagnosis;
        #   - PlenoraBeatScheduler shim does not load
        #     config-based entries -> no firing path, deadline
        #     expires (this is the regression we lock against);
        #   - worker fails to register cleanroom_beat_task -> task
        #     fires but worker raises NotRegistered, no SUCCESS in
        #     backend, deadline expires.
        working-directory: backend
        env:
          PLENORA_CLEANROOM_BEAT_PING: "1"
        run: |
          set -e
          mkdir -p .cleanroom-logs
          # 1. Spawn worker (fresh — 019's worker is dead).
          nohup celery -A workers.celery_app worker \
              --pool=solo --loglevel=info \
              -Q celery -n cleanroom-beat@%h \
              > .cleanroom-logs/beat-worker.log 2>&1 &
          beat_worker_pid=$!
          echo "$beat_worker_pid" > .cleanroom-logs/beat-worker.pid
          echo "celery worker (beat smoke) started (pid=${beat_worker_pid})"
          # 2. Spawn beat with PlenoraBeatScheduler. The opt-in env
          # var is set on this shell only; it propagates to the
          # `celery beat` child. Production beat NEVER sees this.
          nohup celery -A workers.celery_app beat \
              -S workers.beat_scheduler.PlenoraBeatScheduler \
              --loglevel=info \
              > .cleanroom-logs/beat.log 2>&1 &
          beat_pid=$!
          echo "$beat_pid" > .cleanroom-logs/beat.pid
          echo "celery beat started (pid=${beat_pid})"
          # 3. Trap-based teardown for BOTH processes.
          trap '
            kill -TERM "$(cat .cleanroom-logs/beat.pid 2>/dev/null)" 2>/dev/null || true;
            kill -TERM "$(cat .cleanroom-logs/beat-worker.pid 2>/dev/null)" 2>/dev/null || true;
            sleep 2;
            kill -9 "$(cat .cleanroom-logs/beat.pid 2>/dev/null)" 2>/dev/null || true;
            kill -9 "$(cat .cleanroom-logs/beat-worker.pid 2>/dev/null)" 2>/dev/null || true;
          ' EXIT
          # 4. Bounded smoke probe. Scans Redis backend keyspace for
          # the canonical "beat_pong" result; exits as soon as found.
          python - <<'PYEOF'
          import json
          import sys
          import time

          import redis as _redis
          from workers.celery_app import celery_app

          backend_url = celery_app.conf.result_backend
          r = _redis.Redis.from_url(backend_url)

          deadline = time.monotonic() + 25.0
          found_key = None
          while time.monotonic() < deadline:
              for key in r.scan_iter(match="celery-task-meta-*", count=100):
                  raw = r.get(key)
                  if not raw:
                      continue
                  try:
                      meta = json.loads(raw)
                  except Exception:
                      continue
                  if (
                      meta.get("status") == "SUCCESS"
                      and meta.get("result") == "beat_pong"
                  ):
                      found_key = key.decode("utf-8") if isinstance(key, (bytes, bytearray)) else str(key)
                      break
              if found_key:
                  break
              time.sleep(0.5)

          if found_key:
              elapsed = 25.0 - (deadline - time.monotonic())
              print(
                  f"OK: cleanroom.beat_ping fired and round-tripped "
                  f"(key={found_key}, elapsed={elapsed:.1f}s)"
              )
              sys.exit(0)

          print(
              "::error::No cleanroom.beat_ping SUCCESS observed in result "
              "backend within 25s deadline"
          )
          sys.exit(1)
          PYEOF

      - name: Upload beat log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cleanroom-celery-beat-log
          path: |
            backend/.cleanroom-logs/beat.log
            backend/.cleanroom-logs/beat-worker.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop backend
        # Teardown best-effort. `if: always()` cosi' gira anche se
        # uno step precedente e' fallito.
        if: always()
        working-directory: backend
        run: |
          if [ -f .cleanroom-logs/uvicorn.pid ]; then
            pid=$(cat .cleanroom-logs/uvicorn.pid)
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" || true
              sleep 2
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi
          # Best-effort kill of the cleanroom Celery worker if its
          # own EXIT trap did not run (e.g. a step earlier in the
          # job got cancelled).
          if [ -f .cleanroom-logs/worker.pid ]; then
            wpid=$(cat .cleanroom-logs/worker.pid)
            if kill -0 "$wpid" 2>/dev/null; then
              kill "$wpid" || true
              sleep 2
              kill -9 "$wpid" 2>/dev/null || true
            fi
          fi
          # Same fallback for the beat smoke worker + beat process
          # (INSTALLATION-021). If the beat step's EXIT trap fired
          # cleanly these PID files reference dead processes; kill
          # is a no-op.
          for fname in beat-worker.pid beat.pid; do
            if [ -f ".cleanroom-logs/$fname" ]; then
              bpid=$(cat ".cleanroom-logs/$fname")
              if kill -0 "$bpid" 2>/dev/null; then
                kill "$bpid" || true
                sleep 2
                kill -9 "$bpid" 2>/dev/null || true
              fi
            fi
          done

      - name: Upload backend log on failure
        # Log artifact upload per diagnostica post-mortem in caso di
        # /ready timeout o post-condition fail.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cleanroom-uvicorn-log
          path: backend/.cleanroom-logs/uvicorn.log
          if-no-files-found: ignore
          retention-days: 7
