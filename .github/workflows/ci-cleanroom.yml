name: CI Cleanroom

on:
  pull_request:
    paths:
      - ".python-version"
      - "scripts/check_python_version.py"
      - "backend/**"
      - ".github/workflows/ci-cleanroom.yml"
  push:
    branches: [main]
    paths:
      - ".python-version"
      - "scripts/check_python_version.py"
      - "backend/**"
      - ".github/workflows/ci-cleanroom.yml"
  workflow_dispatch:

jobs:
  cleanroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Check Python version contract
        run: python scripts/check_python_version.py
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify Dramatiq cleanroom readiness
        working-directory: backend
        run: |
          python - <<'PY'
          import importlib

          # Importare il bootstrap del worker registra tutti gli actor con i
          # nomi storici dei task. set_broker usa RabbitmqBroker lazy: nessuna
          # connessione al broker a import-time (questo job non ha RabbitMQ).
          import workers.dramatiq_app as dramatiq_app

          for module_name in (
              "workers.tasks.enrichment_task",
              "workers.tasks.carica_task",
              "workers.tasks.schedule_task",
              "workers.tasks.pipeline_task",
          ):
              importlib.import_module(module_name)

          registered = {
              getattr(dramatiq_app, attr).actor_name
              for attr in dir(dramatiq_app)
              if hasattr(getattr(dramatiq_app, attr), "actor_name")
          }
          for actor_name in (
              "cleanroom.ping",
              "cleanroom.beat_ping",
              "carica.execute",
              "pipeline.execute",
              "tasks.execute_enrichment",
              "workers.tasks.schedule_task.schedule_pipeline_task",
              "workers.tasks.schedule_task.beat_heartbeat",
          ):
              assert actor_name in registered, f"actor mancante: {actor_name}"

          # Il runner del beat (APScheduler) deve risolvere (ExecStart del
          # systemd plenora-beat.service: python -m workers.beat).
          from workers.beat_scheduler import PlenoraBeatScheduler
          assert PlenoraBeatScheduler
          from workers.beat import run as beat_run
          assert beat_run
          PY
