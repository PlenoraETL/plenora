name: Docker Compose Smoke

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "backend/**"
      - "frontend/**"
      - "scripts/docker-api-smoke.sh"
      - ".github/workflows/docker-compose.yml"
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "backend/**"
      - "frontend/**"
      - "scripts/docker-api-smoke.sh"
      - ".github/workflows/docker-compose.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PLENORA_ACCEPTANCE_TIMEOUT_SECONDS: "180"
      PLENORA_ACCEPTANCE_POLL_INTERVAL_SECONDS: "2"
      PLENORA_ACCEPTANCE_CURL_MAX_TIME_SECONDS: "5"
      PLENORA_SMOKE_USERNAME: "smoke@example.test"
      PLENORA_SMOKE_PASSWORD: "smoke-password"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare isolated CI environment
        run: |
          cp .env.docker.example .env.docker
          sed -i 's/^ENVIRONMENT=.*/ENVIRONMENT=development/' .env.docker
          sed -i 's|^PLENORA_ENCRYPTION_KEY=.*|PLENORA_ENCRYPTION_KEY=YmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmI=|' .env.docker
          sed -i 's/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=ci-jwt-secret-ci-jwt-secret-ci-jwt-secret-ci-jwt-secret/' .env.docker
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres-password/' .env.docker
          sed -i 's/^RABBITMQ_DEFAULT_PASS=.*/RABBITMQ_DEFAULT_PASS=ci-rabbit-password/' .env.docker
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql://plenora:ci-postgres-password@postgres:5432/plenora|' .env.docker
          sed -i 's|^DRAMATIQ_BROKER_URL=.*|DRAMATIQ_BROKER_URL=amqp://plenora:ci-rabbit-password@rabbitmq:5672/|' .env.docker
          docker network create plenora
      - name: Validate compose file
        run: docker compose config
      - name: Build images
        run: docker compose build backend frontend
      - name: Start infrastructure
        run: docker compose up -d --wait postgres rabbitmq object-storage
      - name: Start backend
        run: docker compose up -d backend
      - name: Infrastructure smoke
        run: bash scripts/docker-api-smoke.sh --infrastructure-only
      - name: Seed smoke user
        run: docker compose exec -T backend python -m app.core.auth.smoke_seed
      - name: Run full Docker API smoke
        run: bash scripts/docker-api-smoke.sh
      - name: Dump Compose diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=300 backend postgres rabbitmq object-storage
      - name: Stop services
        if: always()
        run: |
          docker compose down -v
          docker network rm plenora || true
