name: Docker Compose

on:
  pull_request:
    paths:
      - ".github/workflows/docker-compose.yml"
      - ".dockerignore"
      - ".env.docker.example"
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "scripts/docker-validate.sh"
      - "scripts/docker-api-smoke.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker-compose.yml"
      - ".dockerignore"
      - ".env.docker.example"
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "scripts/docker-validate.sh"
      - "scripts/docker-api-smoke.sh"

concurrency:
  group: docker-compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Compose config, build, and backend smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare compose environment
        run: |
          cp .env.docker.example .env.docker
          python - <<'PY'
          from pathlib import Path

          env = Path(".env.docker")
          text = env.read_text(encoding="utf-8")
          replacements = {
              "PLENORA_ENCRYPTION_KEY=": "PLENORA_ENCRYPTION_KEY=ci-fernet-placeholder",
              "JWT_SECRET_KEY=": "JWT_SECRET_KEY=ci-jwt-placeholder",
          }
          for prefix, value in replacements.items():
              lines = []
              replaced = False
              for line in text.splitlines():
                  if line.startswith(prefix):
                      lines.append(value)
                      replaced = True
                  else:
                      lines.append(line)
              if not replaced:
                  lines.append(value)
              text = "\n".join(lines) + "\n"
          env.write_text(text, encoding="utf-8")
          PY

      - run: docker compose config

      - run: docker compose build backend frontend

      - name: Start compose dependencies
        run: docker compose up -d postgres redis

      - name: Start backend
        run: docker compose up -d backend

      - name: Poll backend health and readiness
        env:
          PLENORA_ACCEPTANCE_TIMEOUT_SECONDS: "120"
          PLENORA_ACCEPTANCE_POLL_INTERVAL_SECONDS: "2"
          PLENORA_ACCEPTANCE_CURL_MAX_TIME_SECONDS: "5"
        run: bash scripts/docker-api-smoke.sh --infrastructure-only

      - name: Seed Docker smoke identity
        run: |
          docker compose exec -T \
            -e PLENORA_SMOKE_USERNAME=smoke-user \
            -e PLENORA_SMOKE_PASSWORD=smoke-password-change-me \
            backend python -m app.core.auth.smoke_seed

      - name: Run full Docker API smoke
        env:
          PLENORA_ACCEPTANCE_TIMEOUT_SECONDS: "120"
          PLENORA_ACCEPTANCE_POLL_INTERVAL_SECONDS: "2"
          PLENORA_ACCEPTANCE_CURL_MAX_TIME_SECONDS: "5"
          PLENORA_SMOKE_USERNAME: smoke-user
          PLENORA_SMOKE_PASSWORD: smoke-password-change-me
        run: bash scripts/docker-api-smoke.sh

      - name: Dump compose diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail 200 postgres redis backend || true

      - name: Stop compose services
        if: always()
        run: docker compose stop || true
