name: CI

# Phase 3 Batch A — CI minima. Scope: backend pytest + frontend vitest.
# Niente coverage gate, niente mutation, niente DB matrix integration:
# i test che richiedono DB live (oracle/mysql/mssql/postgres) si auto-skip
# via _<dialect>_reachable() guard interno (vedi tests2/integration/),
# quindi la suite in CI esegue il subset locale-friendly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annulla run precedenti sullo stesso PR/branch quando arriva un nuovo push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test session vive in storage policy DB (no S3 reale, no BACKUP_BUCKET
      # required runtime) — coerente con tests2/conftest.py:21.
      STORAGE_POLICY: db
      # DATABASE_URL dummy: necessario perche' app/db/pg_connection.py:111-113
      # legge l'env var a module-level e solleva RuntimeError a import time
      # se manca, prima che pytest possa applicare gli stub di conftest.py.
      # Il valore e' un URL postgres formato valido ma irraggiungibile (porta
      # 1, host loopback): nessun psycopg2.connect reale viene invocato
      # perche' conftest.py:73-85 stubpa init_db/init_all_dbs/apply_pending
      # _migrations a no-op, e la fixture autouse (riga 247-282) stubpa
      # pg_connection.execute a no-op per ogni test non-integration. Vedi
      # orchestrate/phase_0_consolidation/ci_red_baseline_analysis.md §1.4.
      DATABASE_URL: postgresql://nobody:nopass@127.0.0.1:1/test_unit_no_real_db
      # BACKUP_BUCKET dummy: i test in tests2/admin_backups/test_degraded_paths.py
      # importano app.core.admin_backups.service che invoca
      # cloud_backends.get_backup_object_storage() -> _get_backup_bucket() che
      # legge os.getenv("BACKUP_BUCKET") (o BACKUP_S3_BUCKET legacy) e solleva
      # ValueError se entrambe vuote. I test sono "degraded paths": mockano
      # internamente boto3 / ClientError, quindi il bucket non viene mai
      # realmente toccato — serve solo a far passare il guard env. Pattern
      # identico a DATABASE_URL: nome formato valido, nessun S3 reale.
      # Vedi orchestrate/phase_0_consolidation/ci_red_3binari_plan.md §A1.
      BACKUP_BUCKET: test-backup-bucket-no-real-s3
      # Redis broker per test che chiamano Celery/blacklist (fakeredis copre
      # gli unit, ma alcuni integration usano client redis-py reale).
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate OpenAPI frontend contract manifest
        run: python backend/scripts/export_openapi_manifest.py --output frontend/src/api/openapi-contract.manifest.json

      - name: Ensure OpenAPI frontend contract manifest is committed
        run: git diff --exit-code -- frontend/src/api/openapi-contract.manifest.json

      - name: Run pytest
        working-directory: backend
        # -c puntando al file dedicato di tests2/. Niente coverage gate in
        # questo batch (T-01 vincolo). Niente -p no:randomly perche'
        # pytest-randomly non e' in deps (P1-3 separato).
        #
        # Binario B-1: deselect dei test che spawnano un backend HTTP live
        # (uvicorn app.main:app via fixture backend_server / integration_
        # backend_server). Restano vivi nel codebase, marcati automaticamente
        # via pytest_collection_modifyitems in tests2/{functional,integration}
        # /conftest.py. Gireranno in workflow tier functional/manual/nightly
        # separato (Binario B-2, follow-up). Vedi tests2/pytest.ini per la
        # definizione del marker requires_backend_http_service.
        run: pytest tests2/ -c tests2/pytest.ini -m "not requires_backend_http_service"

  frontend:
    name: Frontend vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run vitest
        working-directory: frontend
        # `npm test` e' aliasato a `vitest run` (single-shot, no watch).
        run: npm test
