# BE-GO-READY-INSTALL-011-FIRST-DOCKER-SCAFFOLD
#
# First executable Docker scaffold for Plenora-ETL. Brings up:
#   - postgres   : Plenora catalog DB (schema autocreates on backend boot;
#                  also result/progress store, leader-lock, JWT blacklist)
#   - rabbitmq   : task broker (Dramatiq)
#   - backend    : FastAPI (uvicorn :5004) with /health and /ready
#   - worker     : Dramatiq data-plane worker (1 thread, pipeline pesanti)
#   - worker-control: Dramatiq control/scheduler/default worker
#   - beat       : APScheduler beat (python -m workers.beat)
#   - frontend   : Vite production build served by nginx (:3000 -> :80)
#
# Runtime payloads live on an S3-compatible data plane. The bundled
# single-node provider is SeaweedFS; applications only use the S3 API and can
# point at MinIO/AIStor/AWS/R2 without code changes.

services:

  postgres:
    image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: plenora
      POSTGRES_DB: plenora
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plenora -d plenora"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Plenora 2.0 (Fase 5): RabbitMQ e' il broker dei task (Dramatiq); Redis
  # e' stato rimosso (result/progress, lock e blacklist sono su PostgreSQL).
  # Nessuna porta host: solo rete compose.
  rabbitmq:
    image: rabbitmq:4-alpine@sha256:740611de227445da842c1fc8be2d00c7fb6e18df813b741a41e04f871b1e5b2d
    env_file:
      - .env.docker
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: plenora-backend:scaffold
    env_file:
      - .env.docker
    environment:
      DATA_DIR: /data
    volumes:
      - data-dir:/data
    ports:
      - "5004:5004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      object-storage:
        condition: service_started
    # CMD inherited from Dockerfile (uvicorn). HEALTHCHECK inherited.
    # Plenora 2.0: l'API dispatcha i task su RabbitMQ (Dramatiq); stato,
    # lock, blacklist e rate-limit sono su PostgreSQL (Redis rimosso).
    restart: unless-stopped

  worker:
    image: plenora-backend:scaffold
    # Reuses the backend image; rebuild path is `docker compose build
    # backend`. Keeping it here means `docker compose up worker` will
    # also build the backend image on first run.
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.docker
    environment:
      DATA_DIR: /data
      DRAMATIQ_PROCESSES: 2
      DRAMATIQ_THREADS: 1
      dramatiq_queue_prefetch: 1
      dramatiq_delay_queue_prefetch: 1
    volumes:
      - data-dir:/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      object-storage:
        condition: service_started
      backend:
        condition: service_started
    # Data-plane isolato: un solo thread per processo evita merge pandas
    # concorrenti nello stesso budget RSS. Scalare questo servizio aumenta i
    # processi isolati, non i thread che condividono memoria.
    entrypoint: ["python", "-m", "dramatiq", "workers.dramatiq_app"]
    command: ["--queues", "data-plane", "--processes", "1", "--threads", "1"]
    healthcheck:
      disable: true
    restart: unless-stopped

  object-storage:
    image: chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
    command: ["mini", "-dir=/data"]
    env_file:
      - .env.docker
    volumes:
      - object-storage-data:/data
    restart: unless-stopped

  worker-control:
    image: plenora-backend:scaffold
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.docker
    environment:
      DATA_DIR: /data
      DRAMATIQ_PROCESSES: 2
      DRAMATIQ_THREADS: 2
      dramatiq_queue_prefetch: 1
      dramatiq_delay_queue_prefetch: 1
    volumes:
      - data-dir:/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      object-storage:
        condition: service_started
      backend:
        condition: service_started
    # Task leggeri e di coordinamento non competono con i DataFrame del
    # data-plane: cleanup, backup, scheduler e coda default.
    entrypoint: ["python", "-m", "dramatiq", "workers.dramatiq_app"]
    command: ["--queues", "control-plane", "scheduler", "default", "--processes", "1", "--threads", "2"]
    healthcheck:
      disable: true
    restart: unless-stopped

  beat:
    image: plenora-backend:scaffold
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.docker
    environment:
      DATA_DIR: /data
    volumes:
      - data-dir:/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      object-storage:
        condition: service_started
      backend:
        condition: service_started
    # Plenora 2.0 Fase 3: il beat gira su APScheduler (workers.beat), non piu'
    # su celery beat. Singleton garantito dal leader-lock su PostgreSQL
    # (beat_leader_locks): scalare il beat e' safe (le repliche extra vanno in
    # standby) ma non necessario.
    entrypoint: ["python", "-m", "workers.beat"]
    command: []
    healthcheck:
      disable: true
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${FRONTEND_VITE_API_URL:-}
        VITE_SENTRY_DSN: ${FRONTEND_VITE_SENTRY_DSN:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${FRONTEND_VITE_SENTRY_TRACES_SAMPLE_RATE:-0.1}
    image: plenora-frontend:scaffold
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  data-dir:
  object-storage-data:

networks:
  default:
    name: ${PLENORA_DOCKER_NETWORK:-plenora}
    external: true
