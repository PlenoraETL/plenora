# BE-GO-READY-INSTALL-011-FIRST-DOCKER-SCAFFOLD
#
# First executable Docker scaffold for Plenora-ETL. Brings up:
#   - postgres   : Plenora catalog DB (schema autocreates on backend boot;
#                  also result/progress store, leader-lock, JWT blacklist)
#   - rabbitmq   : task broker (Dramatiq)
#   - backend    : FastAPI (uvicorn :5004) with /health and /ready
#   - worker     : Dramatiq worker (python -m dramatiq workers.dramatiq_app)
#   - beat       : APScheduler beat (python -m workers.beat)
#   - frontend   : Vite production build served by nginx (:3000 -> :80)
#
# MinIO and the systemd backup unit are intentionally OUT of this
# scaffold (target shape lives in docs/ops/install-docker.md and the
# single-server runbook in docs/ops/install-docker-single-server.md). This
# compose intentionally provides the minimum to
# exercise the smoke harness from docs/ops/install-marco-dry-run.md.
#
# Production caveat: STORAGE_POLICY=db means BYTEA-only blob path.
# Real deployments should switch to object_storage; not in scope here.

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: plenora
      POSTGRES_PASSWORD: plenora
      POSTGRES_DB: plenora
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plenora -d plenora"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Plenora 2.0 (Fase 5): RabbitMQ e' il broker dei task (Dramatiq); Redis
  # e' stato rimosso (result/progress, lock e blacklist sono su PostgreSQL).
  # Nessuna porta host: solo rete compose.
  rabbitmq:
    image: rabbitmq:4-alpine
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: plenora-backend:scaffold
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://plenora:plenora@postgres:5432/plenora
      DRAMATIQ_BROKER_URL: amqp://guest:guest@rabbitmq:5672
      DATA_DIR: /data
    volumes:
      - data-dir:/data
    ports:
      - "5004:5004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # CMD inherited from Dockerfile (uvicorn). HEALTHCHECK inherited.
    # Plenora 2.0: l'API dispatcha i task su RabbitMQ (Dramatiq); stato,
    # lock, blacklist e rate-limit sono su PostgreSQL (Redis rimosso).
    restart: unless-stopped

  worker:
    image: plenora-backend:scaffold
    # Reuses the backend image; rebuild path is `docker compose build
    # backend`. Keeping it here means `docker compose up worker` will
    # also build the backend image on first run.
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://plenora:plenora@postgres:5432/plenora
      DRAMATIQ_BROKER_URL: amqp://guest:guest@rabbitmq:5672
      DATA_DIR: /data
    volumes:
      - data-dir:/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    # Plenora 2.0: il worker esegue gli actor Dramatiq da RabbitMQ
    # (Redis rimosso). 1 processo / 8 thread per
    # lo scaffold single-machine; il routing actor->coda e' in dramatiq_app.
    entrypoint: ["python", "-m", "dramatiq", "workers.dramatiq_app"]
    command: ["--processes", "1", "--threads", "8"]
    healthcheck:
      disable: true
    restart: unless-stopped

  beat:
    image: plenora-backend:scaffold
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://plenora:plenora@postgres:5432/plenora
      DRAMATIQ_BROKER_URL: amqp://guest:guest@rabbitmq:5672
      DATA_DIR: /data
    volumes:
      - data-dir:/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    # Plenora 2.0 Fase 3: il beat gira su APScheduler (workers.beat), non piu'
    # su celery beat. Singleton garantito dal leader-lock su PostgreSQL
    # (beat_leader_locks): scalare il beat e' safe (le repliche extra vanno in
    # standby) ma non necessario.
    entrypoint: ["python", "-m", "workers.beat"]
    command: []
    healthcheck:
      disable: true
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${FRONTEND_VITE_API_URL:-http://localhost:5004}
    image: plenora-frontend:scaffold
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  data-dir:

networks:
  default:
    name: ${PLENORA_DOCKER_NETWORK:-plenora}
    external: true
